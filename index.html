function wireManualSel(r,celW,celH){
  var man=CP.manual
  var ehSig=man.camada==='sinal', sel=ehSig?man.sigSel:man.acSel
  var ng=document.getElementById('cp_man_novogrupo'); if(ng)ng.onclick=function(){ sel.grupoAtivo=(sel.grupoAtivo|0)+1; manAtualizaResumoSel() }
  var clr=document.getElementById('cp_man_clrsel'); if(clr)clr.onclick=function(){ sel.assign={}; sel.grupoAtivo=0; manPintaPlacas(celW,celH); manAtualizaResumoSel() }
  var grid=document.getElementById('cp_man_grid'); if(!grid)return
  var arrastando=false, modo=null, ultimo=''
  function placaEmXY(x,y){
    var rect=grid.getBoundingClientRect()
    var c=Math.floor((x-rect.left)/(celW+2)), rm=Math.floor((y-rect.top)/(celH+2))
    if(c<0||rm<0||c>=man.cols||rm>=man.rowsMeia) return null
    var occ=manCelOcupada(rm,c)   // acha a placa (própria ou 50x100 de cima)
    return occ?occ.dono:null
  }
  function aplica(key){
    if(!key || key===ultimo) return
    ultimo=key
    if(modo==='add'){ sel.assign[key]=sel.grupoAtivo|0 } else { delete sel.assign[key] }
    manPintaPlacas(celW,celH); manAtualizaResumoSel()
  }
  grid.onmousedown=function(ev){
    ev.preventDefault()
    var key=placaEmXY(ev.clientX,ev.clientY); if(!key){return}
    arrastando=true; ultimo=''
    // se a placa já está no grupo ativo -> remover; senão adicionar
    modo=(sel.assign[key]===(sel.grupoAtivo|0))?'del':'add'
    aplica(key)
  }
  grid.onmousemove=function(ev){ if(arrastando) aplica(placaEmXY(ev.clientX,ev.clientY)) }
  document.addEventListener('mouseup',function(){ arrastando=false; modo=null; ultimo='' })
  grid.ontouchstart=function(ev){var t=ev.touches[0];var key=placaEmXY(t.clientX,t.clientY);if(!key)return;ev.preventDefault();arrastando=true;ultimo='';modo=(sel.assign[key]===(sel.grupoAtivo|0))?'del':'add';aplica(key)}
  grid.ontouchmove=function(ev){if(!arrastando)return;var t=ev.touches[0];ev.preventDefault();aplica(placaEmXY(t.clientX,t.clientY))}
  grid.ontouchend=function(){arrastando=false;modo=null;ultimo=''}
}
function wireManualGrid(r,celW,celH){
  var man=CP.manual
  document.querySelectorAll('.cp-peca').forEach(function(el){el.onclick=function(){
    man.pecaAtiva=el.getAttribute('data-peca')
    document.querySelectorAll('.cp-peca').forEach(function(p){var on=p.getAttribute('data-peca')===man.pecaAtiva
      p.style.border='2px solid '+(on?'#7aa2ff':'#3a4150'); p.style.background=on?'rgba(61,116,255,.14)':'rgba(255,255,255,.02)'})
  }})
  var clr=document.getElementById('cp_man_clr'); if(clr)clr.onclick=function(){ man.placas={}; manPintaPlacas(celW,celH); manAtualizaResumo(pitchMM(PANELS[CP.modelo]||PANELS['ABSEN NT2.9'])) }
  var grid=document.getElementById('cp_man_grid'); if(!grid)return
  var arrastando=false, modo=null, ultimo=''
  function celFromXY(x,y){
    var rect=grid.getBoundingClientRect()
    var c=Math.floor((x-rect.left)/(celW+2)), rm=Math.floor((y-rect.top)/(celH+2))
    if(c<0||rm<0||c>=man.cols||rm>=man.rowsMeia) return null
    return {rm:rm,c:c}
  }
  function aplica(cel){
    if(!cel) return
    var tag=cel.rm+'_'+cel.c
    if(tag===ultimo) return
    ultimo=tag
    var mudou=(modo==='add')?manColoca(cel.rm,cel.c):manRemove(cel.rm,cel.c)
    if(mudou){ manPintaPlacas(celW,celH); manAtualizaResumo(pitchMM(PANELS[CP.modelo]||PANELS['ABSEN NT2.9'])) }
  }
  grid.onmousedown=function(ev){
    ev.preventDefault()
    var cel=celFromXY(ev.clientX,ev.clientY); if(!cel)return
    arrastando=true; ultimo=''
    modo = manCelOcupada(cel.rm,cel.c) ? 'del' : 'add'
    aplica(cel)
  }
  grid.onmousemove=function(ev){ if(arrastando) aplica(celFromXY(ev.clientX,ev.clientY)) }
  document.addEventListener('mouseup',function(){ arrastando=false; modo=null; ultimo='' })
  grid.ontouchstart=function(ev){var t=ev.touches[0];var cel=celFromXY(t.clientX,t.clientY);if(!cel)return;ev.preventDefault();arrastando=true;ultimo='';modo=manCelOcupada(cel.rm,cel.c)?'del':'add';aplica(cel)}
  grid.ontouchmove=function(ev){if(!arrastando)return;var t=ev.touches[0];ev.preventDefault();aplica(celFromXY(t.clientX,t.clientY))}
  grid.ontouchend=function(){arrastando=false;modo=null;ultimo=''}
}
function desenhaGrade(r){
  if(CP.manual && CP.manual.ativo){ return desenhaGradeManual(r) }
  var isSig=CP.mapa==='sinal'
  var s=isSig?CP.sigSel:CP.acSel
  var acC=calcAC(r,CP.ac)
  var cel=Math.max(20,Math.min(40,Math.floor(760/r.cabsW)))
  // agrupa por grupo p/ totais
  var grupos={} // idx -> {placas, px, w}
  for(var kk in s.assign){ var g=s.assign[kk]; if(!grupos[g])grupos[g]={placas:0,px:0,w:0}
    grupos[g].placas++; grupos[g].px+=r.pxPerCab; grupos[g].w+=r.m.maxW }
  var html='<div id="cp_gridwrap" tabindex="0" style="outline:none;display:inline-block;-webkit-user-select:none;user-select:none">'
  html+='<div style="display:grid;grid-template-columns:repeat('+r.cabsW+','+cel+'px);gap:2px;width:max-content">'
  for(var row=0;row<r.cabsH;row++) for(var c=0;c<r.cabsW;c++){
    var k=row+'_'+c
    var temGrupo = (k in s.assign)
    var g = temGrupo? s.assign[k] : null
    var ord = temGrupo? (s.seq[k]||'') : ''
    var cor = temGrupo? CORES[g%CORES.length] : '#3a4150'
    var ativo = temGrupo && g===s.grupoAtivo
    var bg = temGrupo? (cor+'33') : 'rgba(255,255,255,.02)'
    var estouro = temGrupo && grupos[g] && isSig && grupos[g].px>LIM_PX
    if(estouro){ cor='#ff2b38'; bg='rgba(255,43,56,.22)' }
    var ehCursor = s.cur && s.cur.r===row && s.cur.c===c
    var borda = ehCursor? '3px solid #fff' : ((ativo?'2px':'1px')+' solid '+cor)
    html+='<div data-cell="'+k+'" data-r="'+row+'" data-c="'+c+'" title="'+(temGrupo?((isSig?'Porta ':'Circuito ')+(g+1)+' · ordem '+ord):'clique p/ adicionar')+'" '+
      'style="height:'+cel+'px;background:'+bg+';border:'+borda+';border-radius:4px;cursor:pointer;'+(ehCursor?'box-shadow:0 0 0 2px rgba(255,255,255,.35);':'')+
      'display:grid;place-items:center;font-size:'+(cel<26?9:11)+'px;font-weight:800;color:'+cor+'">'+ord+'</div>'
  }
  html+='</div><div class="mini" style="margin-top:6px;opacity:.75">🖱 Clique numa placa para adicionar à '+(isSig?'porta':'circuito')+' ativa. <b>Clique e arraste</b> para pintar várias de uma vez. Clicar de novo remove.</div></div>'
  $('#cp_grid').innerHTML=html
  // ---- seleção com mouse: clique + arraste (sem re-render durante o arraste) ----
  var gridBox=$('#cp_grid').querySelector('#cp_gridwrap')
  var arrastando=false, modoArraste='add', tocadas={}
  function atribui(k){
    if(k in s.assign) return
    var ordMax=0; for(var kk in s.assign){ if(s.assign[kk]===s.grupoAtivo){ var o=s.seq[kk]||0; if(o>ordMax)ordMax=o } }
    s.assign[k]=s.grupoAtivo; s.seq[k]=ordMax+1
  }
  function remove(k){ if(k in s.assign){ delete s.assign[k]; delete s.seq[k] } }
  function pintaCelula(el){
    var k=el.getAttribute('data-cell')
    var temG=(k in s.assign), g=temG?s.assign[k]:null
    var cor=temG?CORES[g%CORES.length]:'#3a4150'
    var ativo=temG&&g===s.grupoAtivo
    el.style.background=temG?(cor+'33'):'rgba(255,255,255,.02)'
    el.style.border=(ativo?'2px':'1px')+' solid '+cor
    el.style.color=cor
    el.textContent=temG?(s.seq[k]||''):''
  }
  function aplica(el){
    if(!el) return
    var k=el.getAttribute('data-cell'); if(!k) return
    if(tocadas[k]) return // não repinta a mesma célula no mesmo arraste
    tocadas[k]=1
    if(modoArraste==='del') remove(k); else atribui(k)
    pintaCelula(el)
  }
  function celulaDoPonto(x,y){
    var el=document.elementFromPoint(x,y)
    while(el && !el.getAttribute('data-cell')) el=el.parentElement
    return (el && el.getAttribute('data-cell'))?el:null
  }
  if(gridBox){
    gridBox.ondragstart=function(e){ e.preventDefault(); return false } // mata drag nativo
    gridBox.onmousedown=function(ev){
      var el=celulaDoPonto(ev.clientX,ev.clientY); if(!el) return
      ev.preventDefault()
      arrastando=true; tocadas={}
      var k=el.getAttribute('data-cell')
      modoArraste=(s.assign[k]===s.grupoAtivo)?'del':'add'
      aplica(el)
    }
    gridBox.onmousemove=function(ev){
      if(!arrastando) return
      var el=celulaDoPonto(ev.clientX,ev.clientY)
      if(el) aplica(el)
    }
  }
  var fimArraste=function(){ if(arrastando){ arrastando=false; tocadas={}; desenhaGrade(r) } }
  document.onmouseup=fimArraste
  // chip do grupo ativo
  var at=$('#cp_ativo')
  if(at){ var cA=CORES[s.grupoAtivo%CORES.length]
    at.style.background=cA+'22'; at.style.color=cA
    at.textContent=(isSig?'Porta ativa: '+(s.grupoAtivo+1):'Circuito ativo: '+(s.grupoAtivo+1)) }
  // contador em tempo real
  var box=$('#cp_contador'); if(!box) return
  var gruposIdx=Object.keys(grupos).map(Number).sort(function(a,b){return a-b})
  var chips=''
  var totalPlacas=0
  gruposIdx.forEach(function(gi){ var G=grupos[gi]; totalPlacas+=G.placas
    var cor=CORES[gi%CORES.length]
    if(isSig){
      var pct=Math.round(G.px/LIM_PX*100)
      var estoura=G.px>LIM_PX
      chips+='<span class="chip" style="background:'+(estoura?'rgba(255,43,56,.2)':cor+'22')+';color:'+(estoura?'#ff2b38':cor)+';'+(gi===s.grupoAtivo?'outline:2px solid '+(estoura?'#ff2b38':cor)+';outline-offset:1px;':'')+'">Porta '+(gi+1)+': '+G.placas+' pl · '+fmt(G.px)+' px · '+pct+'%'+(estoura?' ⚠':'')+'</span>'
    } else {
      var amp=G.w/acC.volt/acC.divFase
      var estoura=amp>acC.ampUtil
      chips+='<span class="chip" style="background:'+(estoura?'rgba(255,43,56,.2)':cor+'22')+';color:'+(estoura?'#ff2b38':cor)+';'+(gi===s.grupoAtivo?'outline:2px solid '+(estoura?'#ff2b38':cor)+';outline-offset:1px;':'')+'">Circuito '+(gi+1)+': '+G.placas+' pl · '+fmt(G.w)+' W · '+(Math.round(amp*10)/10)+' A'+(acC.fase==='tri'?'/f':'')+(estoura?' ⚠':'')+'</span>'
    }
  })
  var falta=r.totalCabs-totalPlacas
  var resumo=isSig
    ? '<div class="mini" style="margin-top:8px">'+gruposIdx.length+' porta(s) usada(s) · limite 650.000 px/porta. '+(falta>0?'<b style="color:#f2b53c">'+falta+' placa(s) ainda sem porta.</b>':'<b style="color:#37c98a">Todas as placas atribuídas ✓</b>')+'</div>'
    : '<div class="mini" style="margin-top:8px">'+gruposIdx.length+' circuito(s) · disjuntor '+acC.disj+'A (uso a 80% = '+(Math.round(acC.ampUtil*10)/10)+'A). '+(falta>0?'<b style="color:#f2b53c">'+falta+' placa(s) ainda sem circuito.</b>':'<b style="color:#37c98a">Todas as placas atribuídas ✓</b>')+'</div>'
  box.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+(chips||'<span class="mini">Nenhuma placa selecionada ainda. Clique nas placas abaixo.</span>')+'</div>'+resumo
}

function chkContaAtencao(c){
  var n=0

}

  chkAtualizaAtencao()

__crud.chkRelatorio=function(){
  var c=CHK
  // monta lista de atenção
  var atencao=[]
  CHK_ESTADO_ITENS.forEach(function(it){ if(c.estado[it]==='ruim')atencao.push({cat:'Estado geral',item:it,situacao:'RUIM'}) })
  ;(c.areas||[]).forEach(function(a){ atencao.push({cat:'Avaria',item:a,situacao:'AFETADA'}) })
  CHK_GRUPOS.forEach(function(gr){ gr.itens.forEach(function(it){ var r=c.itens[chkKey(gr.g,it)]; if(r&&chkEhAtencao(gr.g,it,r)) atencao.push({cat:gr.g,item:it,situacao:r.toUpperCase()}) }) })
  var atencaoRows=atencao.length? atencao.map(function(a){
    return '<tr><td>'+esc(a.cat)+'</td><td><b>'+esc(a.item)+'</b></td><td class="c" style="color:#b00500;font-weight:800">'+esc(a.situacao)+'</td></tr>'
  }).join('') : '<tr><td colspan="3" style="padding:8px;color:#1a7f43;border:1px solid #d7d9de">Nenhum item de atenção — veículo liberado.</td></tr>'
  // estado geral completo
  function estLabel(v){ return v==='bom'?'BOM':v==='medio'?'MÉDIO':v==='ruim'?'RUIM':'—' }
  function estCor(v){ return v==='bom'?'#1a7f43':v==='medio'?'#b8860b':v==='ruim'?'#b00500':'#6b7280' }
  var estRows=CHK_ESTADO_ITENS.map(function(it){
    return '<tr><td>'+esc(it)+'</td><td class="c" style="font-weight:800;color:'+estCor(c.estado[it])+'">'+estLabel(c.estado[it])+'</td></tr>'
  }).join('')
  // grupos completos
  var gruposHtml=CHK_GRUPOS.map(function(gr){
    var rows=gr.itens.map(function(it){var r=c.itens[chkKey(gr.g,it)];
      var atc=r&&chkEhAtencao(gr.g,it,r)
      return '<tr'+(atc?' style="background:#ffecec"':'')+'><td>'+esc(it)+'</td><td class="c" style="font-weight:700;color:'+(r==='sim'?'#1a7f43':r==='nao'?'#b00500':'#6b7280')+'">'+(r?r.toUpperCase():'—')+'</td></tr>'
    }).join('')
    return '<table class="gr"><thead><tr class="band"><td colspan="2">'+esc(gr.g)+'</td></tr><tr><th>Item</th><th class="c" style="width:80px">Resp.</th></tr></thead><tbody>'+rows+'</tbody></table>'
  }).join('')

/* ===================== IMPORTADOR DE KM (Ticket Log) ===================== */
// Lê o relatório "Últimas Quilometragens" do Ticket Log (.xls que é HTML, ou CSV)
// Extrai placa + maior KM, e atualiza km_atual dos veículos. Trocas recalculam sozinhas.
var KM_PREVIEW=null
__crud.kmImportAbrir=function(){
  var inp=document.getElementById('km_file'); if(!inp)return
  inp.value=''
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f)return
    var rd=new FileReader()
    rd.onload=function(){ kmProcessaArquivo(rd.result, f.name) }
    rd.onerror=function(){ toast('Erro ao ler arquivo',false) }
    rd.readAsText(f)  // Ticket Log .xls é HTML/texto; CSV é texto
  }
  inp.click()
}
function kmNum(s){
  // "298.744" -> 298744 ; "1.234,5" -> 1234 (ignora decimal de km)
  var t=String(s||'').replace(/\s/g,'')
  t=t.replace(/\./g,'').replace(/,\d+$/,'')  // remove milhares e decimais
  var n=parseInt(t,10)
  return isNaN(n)?null:n
}
function kmParseHTML(txt){
  var regs=[]
  // pega linhas de dados das classes LinhaPar/LinhaImpar
  var reLinha=/<tr class="Linha(?:Par|Impar)">([\s\S]*?)<\/tr>/g, m
  while((m=reLinha.exec(txt))){
    var tds=[], reTd=/<td[^>]*>([\s\S]*?)<\/td>/g, t
    while((t=reTd.exec(m[1]))){ tds.push(kmLimpa(t[1])) }
    if(tds.length>=5){
      var placa=tds[0], data=tds[2], km=kmNum(tds[4])
      if(placa && km!==null) regs.push({placa:placa.toUpperCase().replace(/[^A-Z0-9]/g,''), data:data, km:km})
    }
  }
  return regs
}
function kmParseCSV(txt){
  var regs=[]
  var linhas=txt.split(/\r?\n/)
  // tenta achar cabeçalho com "placa"/"veículo" e "quilometragem"/"km"
  var sep=txt.indexOf(';')>=0?';':','
  var idxPlaca=-1, idxKm=-1
  for(var i=0;i<linhas.length;i++){
    var cols=linhas[i].split(sep)
    var low=cols.map(function(c){return c.toLowerCase()})
    if(idxPlaca<0){
      low.forEach(function(c,j){ if(idxPlaca<0 && (c.indexOf('placa')>=0||c.indexOf('veíc')>=0||c.indexOf('veic')>=0)) idxPlaca=j
        if(c.indexOf('quilometragem')>=0 || c==='km') idxKm=j })
      continue
    }
    if(idxPlaca>=0 && idxKm>=0 && cols[idxPlaca]){
      var placa=String(cols[idxPlaca]).toUpperCase().replace(/[^A-Z0-9]/g,'')
      var km=kmNum(cols[idxKm])
      if(placa && km!==null) regs.push({placa:placa,data:'',km:km})
    }
  }
  return regs
}
function kmLimpa(s){ return String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&aacute;/g,'á').replace(/&eacute;/g,'é').replace(/&iacute;/g,'í').replace(/&oacute;/g,'ó').replace(/&uacute;/g,'ú').replace(/&ccedil;/g,'ç').replace(/&atilde;/g,'ã').trim() }
function kmProcessaArquivo(txt, nome){
  var regs=[]
  if(/<tr/i.test(txt) && /Linha(Par|Impar)/.test(txt)) regs=kmParseHTML(txt)
  else if(/<table/i.test(txt)) regs=kmParseHTML(txt)  // html genérico
  else regs=kmParseCSV(txt)
  if(!regs.length){ toast('Não encontrei dados de KM no arquivo',false); return }
  // maior KM por placa
  var maxk={}
  regs.forEach(function(r){ if(!maxk[r.placa] || r.km>maxk[r.placa]) maxk[r.placa]=r.km })
  // cruza com a frota
  var frotaMap={}
  ;(DB.fvei||[]).forEach(function(v){ frotaMap[String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'')]=v })
  var linhas=[]
  Object.keys(maxk).forEach(function(placa){
    var v=frotaMap[placa]
    var kmNovo=maxk[placa]
    if(!v){ linhas.push({placa:placa, achou:false, kmAtual:null, kmNovo:kmNovo, delta:null, aplicar:false}) }
    else {
      var kmAtual=+v.km_atual||0
      var delta=kmNovo-kmAtual
      // só sugere aplicar se o novo KM for maior (não retroceder odômetro)
      linhas.push({placa:placa, achou:true, id:v.id, veiculo:v.veiculo||'', kmAtual:kmAtual, kmNovo:kmNovo, delta:delta, aplicar:(kmNovo>kmAtual)})
    }
  })
  linhas.sort(function(a,b){ if(a.achou!==b.achou)return a.achou?-1:1; return String(a.placa).localeCompare(b.placa) })
  KM_PREVIEW=linhas
  kmMostraPreview(nome)
}
function kmMostraPreview(nome){
  var host=document.getElementById('km_modal')
  if(!host){ host=document.createElement('div'); host.id='km_modal'; document.body.appendChild(host) }
  var linhas=KM_PREVIEW||[]
  var vaiAplicar=linhas.filter(function(l){return l.achou&&l.aplicar}).length
  var naoAchou=linhas.filter(function(l){return !l.achou}).length
  var semMudanca=linhas.filter(function(l){return l.achou&&!l.aplicar}).length
  function linhaHTML(l){
    var st, cor
    if(!l.achou){ st='placa não cadastrada'; cor='#9aa0ac' }
    else if(l.aplicar){ st='+'+fmt(l.delta)+' km'; cor='#37c98a' }
    else { st=(l.delta<0?'KM menor (ignorar)':'sem mudança'); cor='#f2b53c' }
    return '<tr>'+
      '<td><input type="checkbox" data-kmap="'+esc(l.placa)+'" '+(l.aplicar?'checked':'')+' '+(l.achou?'':'disabled')+'></td>'+
      '<td><span class="chip nt">'+esc(l.placa)+'</span></td>'+
      '<td class="mini">'+esc(String(l.veiculo||'—').slice(0,22))+'</td>'+
      '<td class="r num">'+(l.kmAtual!==null?fmt(l.kmAtual):'—')+'</td>'+
      '<td class="r num" style="font-weight:700">'+fmt(l.kmNovo)+'</td>'+
      '<td class="r" style="color:'+cor+';font-weight:700">'+st+'</td></tr>'
  }
  host.innerHTML='<div style="position:fixed;inset:0;background:rgba(4,6,12,.72);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)__crud.kmFechar()">'+
    '<div style="background:#0d1117;border:1px solid var(--bd);border-radius:16px;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)">'+
      '<div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bd)">'+
        '<div style="font-weight:800;font-size:16px">⛽ Importar KM — Ticket Log</div><div style="flex:1"></div>'+
        '<button class="ico" onclick="__crud.kmFechar()" style="font-size:18px">✕</button></div>'+
      '<div style="padding:20px">'+
        '<div class="mini" style="opacity:.8;margin-bottom:10px">Arquivo: <b>'+esc(nome||'')+'</b> · '+linhas.length+' placa(s) no relatório. '+
        'Confira e confirme quais KM atualizar. O sistema nunca reduz o odômetro.</div>'+
        '<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">'+
          '<span class="chip ok">'+vaiAplicar+' p/ atualizar</span>'+
          (semMudanca?'<span class="chip wa">'+semMudanca+' sem mudança</span>':'')+
          (naoAchou?'<span class="chip no">'+naoAchou+' não cadastrada(s)</span>':'')+
        '</div>'+
        '<div class="tblwrap" style="max-height:46vh;overflow:auto"><table><thead><tr><th style="width:34px"></th><th>Placa</th><th>Veículo</th><th class="r">KM atual</th><th class="r">KM novo</th><th class="r">Situação</th></tr></thead><tbody>'+
        linhas.map(linhaHTML).join('')+'</tbody></table></div>'+
        '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn p" onclick="__crud.kmAplicar()" style="flex:1;padding:12px">✓ Atualizar KM selecionados</button>'+
        '<button class="btn" onclick="__crud.kmFechar()" style="background:rgba(255,255,255,.06)">Cancelar</button></div>'+
      '</div></div></div>'
}
__crud.kmFechar=function(){ var h=document.getElementById('km_modal'); if(h)h.innerHTML=''; KM_PREVIEW=null }
__crud.kmAplicar=async function(){
  if(!KM_PREVIEW){ return }
  // respeita os checkboxes marcados
  var marcadas={}
  document.querySelectorAll('[data-kmap]').forEach(function(el){ marcadas[el.getAttribute('data-kmap')]=el.checked })
  var aplicar=KM_PREVIEW.filter(function(l){ return l.achou && marcadas[l.placa] })
  if(!aplicar.length){ toast('Nada selecionado para atualizar',false); return }
  var ok=0, erros=0
  for(var i=0;i<aplicar.length;i++){
    var l=aplicar[i]
    try{
      var e=(await sb.from('frota_veiculos').update({km_atual:l.kmNovo}).eq('id',l.id)).error
      if(e) throw new Error(e.message)
      // atualiza local também
      var v=(DB.fvei||[]).find(function(x){return x.id===l.id}); if(v)v.km_atual=l.kmNovo
      ok++
    }catch(err){ erros++ }
  }
  if(typeof loadAll==='function') await loadAll()
  __crud.kmFechar()
  toast(ok+' veículo(s) atualizado(s)'+(erros?(' · '+erros+' erro(s)'):'')+'. Trocas recalculadas.')
  viewFrota()
}

/* ===================== IMPORTADOR DE ABASTECIMENTOS (Ticket Log) ===================== */
// Relatório "Fuel Control por Veículo" (analítico). Lança cada transação, dedup por nº transação, atualiza KM.
var ABA_PREVIEW=null
__crud.abaImportAbrir=function(){
  var inp=document.getElementById('aba_file'); if(!inp)return
  inp.value=''
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f)return
    var rd=new FileReader()
    rd.onload=function(){ abaProcessa(rd.result, f.name) }
    rd.onerror=function(){ toast('Erro ao ler arquivo',false) }
    rd.readAsText(f)
  }
  inp.click()
}
function abaLimpa(s){
  return String(s).replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ')
    .replace(/&aacute;/g,'á').replace(/&eacute;/g,'é').replace(/&iacute;/g,'í').replace(/&oacute;/g,'ó').replace(/&uacute;/g,'ú')
    .replace(/&ccedil;/g,'ç').replace(/&atilde;/g,'ã').replace(/&otilde;/g,'õ').replace(/&acirc;/g,'â').replace(/&ecirc;/g,'ê').replace(/&ocirc;/g,'ô')
    .replace(/&amp;/g,'&').trim()
}
function abaNumBR(s){
  // "2.109,38" -> 2109.38 ; "306,15" -> 306.15
  var t=String(s||'').replace(/\s/g,'').replace(/\./g,'').replace(',','.')
  var n=parseFloat(t); return isNaN(n)?0:n
}
function abaKmInt(s){
  var t=String(s||'').replace(/\s/g,'').replace(/\./g,'').replace(/,\d+$/,'')
  var n=parseInt(t,10); return isNaN(n)?null:n
}
function abaDataISO(s){
  // "05/08/2026 16:35:51" -> "2026-08-05"
  var m=String(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/)
  if(!m)return ''
  return m[3]+'-'+m[2]+'-'+m[1]
}
function abaCombustivel(servico){
  var s=String(servico||'').toUpperCase()
  if(s.indexOf('ARLA')>=0) return 'ARLA'
  if(s.indexOf('S-10')>=0||s.indexOf('S10')>=0) return 'DIESEL S10'
  if(s.indexOf('DIESEL')>=0) return 'DIESEL'
  if(s.indexOf('GASOLINA')>=0) return 'GASOLINA'
  if(s.indexOf('ETANOL')>=0||s.indexOf('ÁLCOOL')>=0||s.indexOf('ALCOOL')>=0) return 'ETANOL'
  return 'DIESEL S10'
}
function abaParse(txt){
  // separa por marcadores de "Veículo: XXX" e linhas de transação
  var tokens=txt.split(/(<tr[^>]*class="Linha(?:Par|Impar)[^"]*"[^>]*>[\s\S]*?<\/tr>|Ve(?:&iacute;|í)culo:&nbsp;&nbsp;[A-Z0-9]+)/)
  var placa=null, out=[]
  for(var i=0;i<tokens.length;i++){
    var tk=tokens[i]
    var mv=tk.match(/Ve(?:&iacute;|í)culo:&nbsp;&nbsp;([A-Z]{3}[0-9][A-Z0-9][0-9]{2})/)
    if(mv){ placa=mv[1].toUpperCase(); continue }
    if(tk.indexOf('<tr')===0 && placa){
      var tds=[], reTd=/<td[^>]*>([\s\S]*?)<\/td>/g, m
      while((m=reTd.exec(tk))){ tds.push(abaLimpa(m[1])) }
      // transação: col0 = data/hora
      if(tds.length>=12 && /^\d{2}\/\d{2}\/\d{4}/.test(tds[0])){
        // mapeamento das colunas do Fuel Control:
        // 0 Data/Hora, 1 Transação, 2 LibRestr, 3 Cartão, 4 Estab, 5 Cidade, 6 Emissora,
        // 7 Quilometragem, 8 Serviço, 9 Valor, 10 KmRodados, 11 Litros, 12 Média, 13 Km/l, 14 Valor/l
        out.push({
          placa:placa.replace(/[^A-Z0-9]/g,''),
          data:abaDataISO(tds[0]),
          transacao_id:String(tds[1]||'').replace(/\D/g,''),
          posto:tds[4]||'',
          cidade:tds[5]||'',
          km:abaKmInt(tds[7]),
          servico:tds[8]||'',
          combustivel:abaCombustivel(tds[8]),
          total:abaNumBR(tds[9]),
          litros:abaNumBR(tds[11]),
          preco_litro:abaNumBR(tds[14]||tds[9])
        })
      }
    }
  }
  return out
}
function abaProcessa(txt, nome){
  var regs=abaParse(txt)
  if(!regs.length){ toast('Não encontrei transações no arquivo',false); return }
  // ids já existentes no banco (dedup)
  var existentes={}
  ;(DB.faba||[]).forEach(function(x){ if(x.transacao_id) existentes[String(x.transacao_id)]=true })
  // frota (pra cruzar placa e atualizar km)
  var frotaMap={}
  ;(DB.fvei||[]).forEach(function(v){ frotaMap[String(v.placa||'').toUpperCase().replace(/[^A-Z0-9]/g,'')]=v })
  var novos=[], dup=0, semPlaca=0
  var vistosNoArquivo={}
  regs.forEach(function(r){
    if(r.transacao_id && (existentes[r.transacao_id] || vistosNoArquivo[r.transacao_id])){ dup++; return }
    if(r.transacao_id) vistosNoArquivo[r.transacao_id]=true
    var v=frotaMap[r.placa]
    r.achou=!!v; r.veiculo=v?(v.veiculo||''):''; r.vid=v?v.id:null
    if(!v) semPlaca++
    novos.push(r)
  })
  ABA_PREVIEW={novos:novos, dup:dup, semPlaca:semPlaca, frotaMap:frotaMap}
  abaMostraPreview(nome)
}
function abaMostraPreview(nome){
  var host=document.getElementById('aba_modal')

  var pv=ABA_PREVIEW, novos=pv.novos
  var totalV=novos.reduce(function(a,r){return a+(r.total||0)},0)
  var totalL=novos.reduce(function(a,r){return a+(r.litros||0)},0)
  function linhaHTML(r,i){

    return '<tr>'+

      '<td>'+(r.achou?'<span class="chip ok">ok</span>':'<span class="chip wa">s/ cadastro</span>')+'</td></tr>'
  }
  host.innerHTML='<div style="position:fixed;inset:0;background:rgba(4,6,12,.72);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)__crud.abaFechar()">'+
    '<div style="background:#0d1117;border:1px solid var(--bd);border-radius:16px;max-width:860px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 80px rgba(0,0,0,.6)">'+
      '<div style="display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bd)">'+
        '<div style="font-weight:800;font-size:16px">⛽ Importar abastecimentos — Ticket Log</div><div style="flex:1"></div>'+
        '<button class="ico" onclick="__crud.abaFechar()" style="font-size:18px">✕</button></div>'+
      '<div style="padding:20px">'+
        '<div class="mini" style="opacity:.8;margin-bottom:10px">Arquivo: <b>'+esc(nome||'')+'</b></div>'+
        '<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">'+

__crud.abaFechar=function(){ var h=document.getElementById('aba_modal'); if(h)h.innerHTML=''; ABA_PREVIEW=null }
__crud.abaAplicar=async function(){
  if(!ABA_PREVIEW)return
  var marc={}
  document.querySelectorAll('[data-abai]').forEach(function(el){ marc[+el.getAttribute('data-abai')]=el.checked })
  var aplicar=ABA_PREVIEW.novos.filter(function(r,i){ return marc[i] })
  if(!aplicar.length){ toast('Nada selecionado',false); return }
  var ok=0, erros=0
  var kmPorPlaca={}
  for(var i=0;i<aplicar.length;i++){
    var r=aplicar[i]
    var payload={data:r.data,placa:r.placa,combustivel:r.combustivel,litros:r.litros,
      preco_litro:r.preco_litro,total:r.total,posto:r.posto,cidade:r.cidade,
      km_final:r.km,transacao_id:r.transacao_id}
    try{
      var res=await sb.from('frota_abastecimento').insert(payload).select().single()
      if(res.error) throw new Error(res.error.message)
      ok++
      // guarda maior km por placa
      if(r.achou && r.km!==null){ if(!kmPorPlaca[r.placa]||r.km>kmPorPlaca[r.placa].km) kmPorPlaca[r.placa]={km:r.km,vid:r.vid} }
    }catch(err){ erros++ }
  }
  // atualiza KM dos veículos (só se maior que o atual)
  var kmOk=0
  for(var placa in kmPorPlaca){
    var info=kmPorPlaca[placa]
    var v=(DB.fvei||[]).find(function(x){return x.id===info.vid})
    if(v && info.km>(+v.km_atual||0)){
      try{ var e=(await sb.from('frota_veiculos').update({km_atual:info.km}).eq('id',info.vid)).error; if(!e){v.km_atual=info.km; kmOk++} }catch(_){}
    }
  }
  if(typeof loadAll==='function') await loadAll()
  __crud.abaFechar()
  toast(ok+' abastecimento(s) lançado(s)'+(kmOk?(' · '+kmOk+' KM atualizado(s)'):'')+(erros?(' · '+erros+' erro(s)'):''))
  viewFrota()
}

__crud.docSalvar=async function(){
  if(!DOC.placa){ toast('Selecione ou informe a placa',false); return }
  if(!DOC.tipo){ toast('Escolha o tipo de documento',false); return }
  var m=document.getElementById('doc_upmsg')
  var url=DOC.arquivo_url, nome=DOC.arquivo_nome
  // upload do PDF se houver arquivo novo
  if(DOC._file){
    try{
      if(m)m.textContent='Enviando PDF…'
      var ext=(DOC._file.name.split('.').pop()||'pdf').toLowerCase()
      var caminho=(DOC.placa||'geral').replace(/[^A-Za-z0-9]/g,'')+'/'+DOC.tipo.replace(/[^A-Za-z0-9]/g,'')+'_'+Date.now()+'.'+ext
      var up=await sb.storage.from('documentos-frota').upload(caminho, DOC._file, {contentType:'application/pdf'})
      if(up.error) throw new Error(up.error.message)
      var pu=sb.storage.from('documentos-frota').getPublicUrl(caminho)
      url=(pu.data&&pu.data.publicUrl)||''
      nome=DOC._file.name
    }catch(err){ toast('Erro no upload: '+err.message,false); if(m)m.textContent='Falha no upload'; return }
  }
  var payload={veiculo:DOC.veiculo,placa:DOC.placa,tipo:DOC.tipo,ano:DOC.ano,
    vencimento:DOC.vencimento||null,numero:DOC.numero,arquivo_url:url,arquivo_nome:nome}
  try{
    if(DOC.id){ var e=(await sb.from('frota_documentos').update(payload).eq('id',DOC.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('frota_documentos').insert(payload).select().single(); if(res.error)throw new Error(res.error.message); if(res.data&&res.data.id)DOC.id=res.data.id }
    // CRLV -> atualiza licenciamento do veículo
    if(DOC.tipo==='CRLV' && DOC.vencimento){
      var v=(DB.fvei||[]).find(function(x){return String(x.placa||'').toUpperCase()===String(DOC.placa||'').toUpperCase()})
      if(v){ try{ await sb.from('frota_veiculos').update({licenciamento:DOC.vencimento}).eq('id',v.id); v.licenciamento=DOC.vencimento }catch(_){} }
    }
    if(typeof loadAll==='function') await loadAll()
    toast('Documento salvo'+(DOC.tipo==='CRLV'&&DOC.vencimento?' · licenciamento do veículo atualizado':''))
    docReset(); viewFrota()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}

__crud.multaSalvar=async function(){
  if(!MUL.placa){ toast('Selecione ou informe a placa',false); return }
  if(!MUL.data){ toast('Informe a data da infração',false); return }
  var m=document.getElementById('mul_upmsg')
  var url=MUL.arquivo_url, nome=MUL.arquivo_nome
  if(MUL._file){
    try{
      if(m)m.textContent='Enviando PDF…'
      var ext=(MUL._file.name.split('.').pop()||'pdf').toLowerCase()
      var caminho=(MUL.placa||'geral').replace(/[^A-Za-z0-9]/g,'')+'/multa_'+Date.now()+'.'+ext
      var up=await sb.storage.from('multas-frota').upload(caminho, MUL._file, {contentType:'application/pdf'})
      if(up.error) throw new Error(up.error.message)
      var pu=sb.storage.from('multas-frota').getPublicUrl(caminho)
      url=(pu.data&&pu.data.publicUrl)||''
      nome=MUL._file.name
    }catch(err){ toast('Erro no upload: '+err.message,false); if(m)m.textContent='Falha no upload'; return }
  }
  var payload={data:MUL.data,placa:MUL.placa,motorista:MUL.motorista,orgao:MUL.orgao,auto_numero:MUL.auto_numero,
    infracao:MUL.infracao,local:MUL.local,gravidade:MUL.gravidade,pontos:(+MUL.pontos||0),valor:(+MUL.valor||0),
    vencimento:MUL.vencimento||null,pago:MUL.pago,descontado_folha:MUL.descontado_folha,arquivo_url:url,arquivo_nome:nome}
  try{
    if(MUL.id){ var e=(await sb.from('frota_multas').update(payload).eq('id',MUL.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('frota_multas').insert(payload).select().single(); if(res.error)throw new Error(res.error.message); if(res.data&&res.data.id)MUL.id=res.data.id }
    if(typeof loadAll==='function') await loadAll()
    toast('Multa salva'); mulReset(); viewFrota()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}

// normaliza o nome do modelo pra agrupar (remove placa, espaços extras, caixa)
function modeloChave(nome){
  var s=String(nome||'').trim().toUpperCase()
  if(!s) return '(SEM MODELO)'
  return s.replace(/\s+/g,' ')
}

__crud.trocasRelatorio=function(){
  var placaModelo={}
  DB.fvei.forEach(function(v){ placaModelo[String(v.placa||'').toUpperCase()]=modeloChave(v.veiculo) })
  // classifica
  var vencidas=[], alerta=[], emdia=[]
  DB.ftro.forEach(function(x){
    var falta=(+x.proxima_troca||0)-(+x.km_atual||0)
    var reg={placa:x.placa,modelo:placaModelo[String(x.placa||'').toUpperCase()]||'(SEM MODELO)',
      item:x.item_controle||'—',trocado:+x.trocado_km||0,proxima:+x.proxima_troca||0,km:+x.km_atual||0,falta:falta}
    if(falta<=0) vencidas.push(reg)
    else if(falta<1000) alerta.push(reg)
    else emdia.push(reg)
  })
  // ordena: vencidas pela mais estourada (falta mais negativa); alerta e emdia pela menor folga
  vencidas.sort(function(a,b){return a.falta-b.falta})
  alerta.sort(function(a,b){return a.falta-b.falta})
  emdia.sort(function(a,b){return a.falta-b.falta})

        (r.falta<=0?('−'+fmt(Math.abs(r.falta))):fmt(r.falta))+'</td></tr>'

    return '<table class="bl"><thead>'+

function drawFVei(){
  const q=($('#fv_q').value||'').toLowerCase()
  const rows=DB.fvei.filter(x=>(String(x.placa||'')+String(x.veiculo||'')).toLowerCase().includes(q))
  $('#ct_fv').textContent=rows.length
  // agrupa por modelo
  const grupos={}
  rows.forEach(x=>{const k=modeloChave(x.veiculo); (grupos[k]=grupos[k]||[]).push(x)})
  const chaves=Object.keys(grupos).sort()
  function linhaVei(x){

/* ---- simulação de carga ---- */
function veicCarga(){
  return DB.fvei.filter(v=>v.largura&&v.comprimento&&v.altura)
    .map(v=>({nome:v.veiculo||v.placa,placa:v.placa,l:+v.largura,c:+v.comprimento,a:+v.altura}))
}
function wireSim(){
  const vs=veicCarga()
  $('#sim_ve').innerHTML='<option value="">— selecione —</option>'
    +vs.map(v=>`<option ${SIM.veiculo===v.nome?'selected':''}>${esc(v.nome)}</option>`).join('')
    +`<option value="FRETE" ${SIM.veiculo==='FRETE'?'selected':''}>FRETE (dimensões avulsas)</option>`
  $('#sim_ev').value=SIM.evento
  var _m=document.getElementById('sim_mot'); if(_m)_m.value=SIM.motorista||''
  $('#sim_ve').onchange=()=>{SIM.veiculo=$('#sim_ve').value
    $('#sim_frete').style.display=SIM.veiculo==='FRETE'?'flex':'none'}
  $('#sim_frete').style.display=SIM.veiculo==='FRETE'?'flex':'none'
  $('#sim_itens').innerHTML=DB.cgpai.map(p=>
    `<tr><td class="mini" style="line-height:1.35">${esc(String(p.sku))}</td>
     <td class="r mini">${fmt(p.largura)}×${fmt(p.comprimento)}×${fmt(p.altura)}</td>
     <td class="r"><input type="number" min="0" value="${SIM.qty[p.sku]||''}" placeholder="0"
        style="width:70px;text-align:right" data-sku="${esc(p.sku)}" class="simq"></td></tr>`).join('')
  document.querySelectorAll('.simq').forEach(i=>i.oninput=()=>{
    SIM.qty[i.dataset.sku]=i.value
    const t=Object.values(SIM.qty).reduce((a,v)=>a+(+v||0),0)
    $('#sim_cnt').textContent=t+' cases'})
  $('#sim_cl').onclick=()=>{SIM={evento:'',veiculo:'',frete:{l:'',c:'',a:''},qty:{},res:null};pintaSetor()}
  $('#sim_go').onclick=()=>{
    SIM.evento=$('#sim_ev').value
    var _mm=document.getElementById('sim_mot'); SIM.motorista=_mm?_mm.value:''
    let v
    if(SIM.veiculo==='FRETE'){
      v={nome:'FRETE',l:+$('#sim_fl').value,c:+$('#sim_fc').value,a:+$('#sim_fa').value}
      if(!v.l||!v.c||!v.a) return toast('Preencha as dimensões do frete',false)
    } else {
      v=veicCarga().find(x=>x.nome===SIM.veiculo)
      if(!v) return toast('Selecione um veículo',false)
    }
    const itens=Object.entries(SIM.qty).filter(([k,q])=>+q>0).map(([sku,qtd])=>({sku,qtd:+qtd}))
    if(!itens.length) return toast('Informe ao menos uma quantidade',false)
    const r=gerarRomaneio(v,itens,DB.cgpai)
    if(r.erro) return toast(r.erro,false)
    SIM.res=r; SIM.veic=v; mostraRomaneio(v,r)
  }
}

    ${r.cabe?'':'<div class="warn" style="background:rgba(255,43,56,.12);border-color:rgba(255,43,56,.4);color:#ffb4ba"><b>A carga excede o comprimento do veículo.</b> Reduza itens ou use um veículo maior.</div>'}
    <div class="eyebrow" style="margin-bottom:8px">Mapa de carga — baú visto de cima</div><div class="glass" style="padding:12px;margin-bottom:14px">${vd.svg}</div><div style="margin:-4px 0 6px">${legM}</div><div class="mini" style="margin:0 0 14px;opacity:.72">Z# = zona · número central = nº de linhas (paredes) · pílula no case = cases empilhados · cor = modelo de painel</div><div class="eyebrow" style="margin-bottom:8px">Endereçamento (fundo → porta)</div>

      <tbody>${r.linhas.map((l,i)=>`<tr>

        <td class="r num">${l.qtdTotal}</td><td class="r num">${fmt(l.prof)}m</td>

/* ============ CONCILIAÇÃO FINANCEIRA ============ */
let CC={ini:'',fim:''}
const round2=v=>Math.round((+v||0)*100)/100
function statusConc(sis,fat){
  if(fat==null||fat==='') return {t:'AGUARDANDO',c:'gy',dif:null}
  const dif=round2(sis-(+fat||0))
  if(Math.abs(dif)<0.01) return {t:'OK',c:'ok',dif:0}
  return {t:'VERIFICAR',c:'no',dif}
}
function achaFat(tipo,chave){
  const r=DB.cconc.find(x=>x.tipo===tipo&&String(x.chave)===String(chave)
    &&x.periodo_ini===CC.ini&&x.periodo_fim===CC.fim)
  return r?r.valor_fatura:null
}
async function salvaFat(tipo,chave,valor){
  const obj={tipo,chave:String(chave),periodo_ini:CC.ini,periodo_fim:CC.fim,
    valor_fatura:(valor===''||valor==null)?null:Number(valor),updated_at:new Date().toISOString()}
  const {error}=await sb.from('compras_conciliacao')
    .upsert(obj,{onConflict:'tipo,chave,periodo_ini,periodo_fim'})
  if(error){ toast('Erro ao salvar: '+error.message,false); return false }
  const i=DB.cconc.findIndex(x=>x.tipo===tipo&&String(x.chave)===String(chave)
    &&x.periodo_ini===CC.ini&&x.periodo_fim===CC.fim)
  if(i>=0) DB.cconc[i].valor_fatura=obj.valor_fatura; else DB.cconc.push(obj)
  return true
}
async function marcaConciliado(id,val){
  const {error}=await sb.from('compras_pedidos').update({conciliado:val}).eq('id',id)
  if(error) return toast('Erro: '+error.message,false)
  const p=DB.cped.find(x=>x.id===id); if(p) p.conciliado=val
  toast(val?'Marcado como conciliado':'Desmarcado')
  desenhaConc()
}
window.__conc={salvaFat,marcaConciliado}

function wireConc(){
  const hj=new Date()
  CC.ini=CC.ini||new Date(hj.getFullYear(),hj.getMonth(),1).toISOString().slice(0,10)
  CC.fim=CC.fim||new Date(hj.getFullYear(),hj.getMonth()+1,0).toISOString().slice(0,10)
  $('#cc_di').value=CC.ini; $('#cc_df').value=CC.fim
  $('#cc_go').onclick=()=>{CC.ini=$('#cc_di').value; CC.fim=$('#cc_df').value; desenhaConc()}
  // formas disponiveis
  const formas=[...new Set(DB.cped.map(x=>x.forma_pagamento||'SEM FORMA'))].sort()
  $('#cc_card').innerHTML='<option value="">Todas</option>'+formas.map(f=>`<option>${esc(f)}</option>`).join('')
  $('#cc_card').onchange=desenhaConc
  desenhaConc()
}
function noPeriodo(){
  return DB.cped.filter(x=>{const d=String(x.data||''); return d&&d>=CC.ini&&d<=CC.fim})
}
function desenhaConc(){
  const P=noPeriodo()
  const total=P.reduce((a,x)=>a+(+x.valor_pago||0),0)
  $('#cc_tot').textContent=brl(total)

  /* --- Bloco 1: por forma de pagamento --- */
  const g={}
  P.forEach(x=>{const f=x.forma_pagamento||'SEM FORMA';g[f]=(g[f]||0)+(+x.valor_pago||0)})
  let somaSis=0,somaFat=0,pend=0
  $('#cc_b1').innerHTML=Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([f,v])=>{
    const fat=achaFat('FORMA',f), st=statusConc(v,fat)
    somaSis+=v; somaFat+=(+fat||0); if(st.t==='AGUARDANDO')pend++
    return `<tr><td class="mini">${esc(f)}</td>
      <td class="r num">${brl(v)}</td>
      <td class="r"><input type="number" step="0.01" value="${fat==null?'':fat}" placeholder="digite"
         style="width:120px;text-align:right;background:rgba(242,181,60,.10);border-color:rgba(242,181,60,.35)"
         onchange="__conc.salvaFat('FORMA',${JSON.stringify(f)},this.value).then(function(ok){if(ok)__conc.redraw()})"></td>
      <td class="r num" style="color:${st.dif===null?'var(--mut)':(st.dif===0?'var(--grn)':'var(--red2)')}">${st.dif===null?'—':brl(st.dif)}</td>
      <td><span class="chip ${st.c}">${st.t}</span></td></tr>`}).join('')
    || '<tr><td colspan="5" class="mini" style="padding:16px">Nenhum pedido no período.</td></tr>'
  const stG=statusConc(somaSis,somaFat||null)
  $('#cc_b1f').innerHTML=`<tr style="background:rgba(225,6,0,.10)">
    <td><b>TOTAL GERAL</b></td><td class="r num"><b>${brl(somaSis)}</b></td>
    <td class="r num"><b>${somaFat?brl(somaFat):'—'}</b></td>
    <td class="r num" style="color:${stG.dif===0?'var(--grn)':'var(--red2)'}"><b>${somaFat?brl(somaSis-somaFat):'—'}</b></td>
    <td><span class="chip ${somaFat?stG.c:'gy'}">${somaFat?stG.t:'AGUARDANDO'}</span></td></tr>`
  $('#cc_stat').textContent=pend?`${pend} forma(s) aguardando fatura`:'todas as formas conferidas'

  /* --- Bloco 2: por ID de compra --- */
  const gi={}
  P.filter(x=>x.id_compra).forEach(x=>{const k=x.id_compra
    gi[k]=gi[k]||{n:0,v:0,canal:x.canal||'—'};gi[k].n++;gi[k].v+=(+x.valor_pago||0)})
  $('#cc_b2').innerHTML=Object.entries(gi).sort((a,b)=>b[1].v-a[1].v).map(([k,o])=>{
    const fat=achaFat('ID_COMPRA',k), st=statusConc(o.v,fat)
    return `<tr><td><span class="chip nt">${esc(k)}</span></td><td class="mini">${esc(o.canal)}</td>
      <td class="r num">${o.n}</td><td class="r num">${brl(o.v)}</td>
      <td class="r"><input type="number" step="0.01" value="${fat==null?'':fat}" placeholder="digite"
         style="width:110px;text-align:right;background:rgba(242,181,60,.10);border-color:rgba(242,181,60,.35)"
         onchange="__conc.salvaFat('ID_COMPRA',${JSON.stringify(k)},this.value).then(function(ok){if(ok)__conc.redraw()})"></td>
      <td class="r num" style="color:${st.dif===null?'var(--mut)':(st.dif===0?'var(--grn)':'var(--red2)')}">${st.dif===null?'—':brl(st.dif)}</td>
      <td><span class="chip ${st.c}">${st.t}</span></td></tr>`}).join('')
    || '<tr><td colspan="7" class="mini" style="padding:16px">Nenhum pedido com ID de compra no período.</td></tr>'

  /* --- Bloco 3: busca por cartão --- */
  const card=$('#cc_card').value
  const lst=P.filter(x=>!card||(x.forma_pagamento||'SEM FORMA')===card)
    .sort((a,b)=>String(a.data).localeCompare(String(b.data)))
  $('#cc_tf').textContent=brl(lst.reduce((a,x)=>a+(+x.valor_pago||0),0))
  $('#cc_b3').innerHTML=lst.slice(0,250).map(x=>
    `<tr><td>${dbr(x.data)}</td><td class="mini">${esc(x.forma_pagamento||'—')}</td>
     <td class="mini">${esc(String(x.fornecedor||'—').slice(0,24))}</td>
     <td class="mini">${esc(String(x.produto||'—').slice(0,28))}</td>
     <td class="r num">${brl(x.valor_pago)}</td>
     <td class="mini">${esc(x.id_compra||'—')}</td>
     <td><input type="checkbox" ${x.conciliado?'checked':''} style="width:17px;height:17px;accent-color:#37c98a;cursor:pointer"
        onchange="__conc.marcaConciliado('${x.id}',this.checked)"></td></tr>`).join('')
    || '<tr><td colspan="7" class="mini" style="padding:16px">Nenhum lançamento.</td></tr>'

  /* --- Bloco 4: matriz cartão × mês --- */
  const meses=[...new Set(DB.cped.map(x=>String(x.data||'').slice(0,7)).filter(Boolean))].sort()
  const cards=[...new Set(DB.cped.map(x=>x.forma_pagamento).filter(f=>f&&f.startsWith('CARTAO')))].sort()
  $('#cc_b4h').innerHTML='<th>Cartão</th>'+meses.map(m=>`<th class="r">${m.slice(5)}/${m.slice(0,4)}</th>`).join('')+'<th class="r">Total</th>'
  const mat={}, totM={}
  DB.cped.forEach(x=>{const f=x.forma_pagamento,m=String(x.data||'').slice(0,7)
    if(!f||!f.startsWith('CARTAO')||!m)return
    mat[f]=mat[f]||{};mat[f][m]=(mat[f][m]||0)+(+x.valor_pago||0)
    totM[m]=(totM[m]||0)+(+x.valor_pago||0)})
  $('#cc_b4').innerHTML=cards.map(c=>{
    const tot=meses.reduce((a,m)=>a+((mat[c]||{})[m]||0),0)
    return `<tr><td><b>${esc(c.replace('CARTAO ',''))}</b></td>`
      +meses.map(m=>{const v=(mat[c]||{})[m]||0
        return `<td class="r num" style="${v?'':'color:var(--mut)'}">${v?brl(v):'-'}</td>`}).join('')
      +`<td class="r num" style="color:var(--red2)"><b>${brl(tot)}</b></td></tr>`}).join('')
    +`<tr style="background:rgba(225,6,0,.10)"><td><b>TOTAL</b></td>`
      +meses.map(m=>`<td class="r num"><b>${totM[m]?brl(totM[m]):'-'}</b></td>`).join('')
      +`<td class="r num"><b>${brl(Object.values(totM).reduce((a,v)=>a+v,0))}</b></td></tr>`
}
window.__conc.redraw=desenhaConc

  let rows=DB.csol.filter(x=>(String(x.produto||'')+String(x.setor||'')+String(x.solicitante||'')).toLowerCase().includes(q))

    && !DB.cped.some(p=>p.id_solicitacao&&x.id_sol&&String(p.id_solicitacao).trim()===String(x.id_sol).trim()))
  else if(st) rows=rows.filter(x=>String(x.status_gestao||'').toUpperCase()===st)
  $('#ct_cs').textContent=rows.length
  $('#tb_cs').innerHTML=rows.slice(0,250).map(x=>{
    const sg=String(x.status_gestao||'').toUpperCase()
    const ch=sg==='APROVADO'?'ok':sg==='NEGADO'?'no':'wa'
    return `<tr><td>${dbr(x.data_pedido)}</td>
      <td class="mini">${esc(String(x.produto||'').slice(0,40))}</td>
      <td class="mini">${esc(String(x.setor||'—').slice(0,22))}</td>
      <td class="mini">${esc(String(x.solicitante||'—').slice(0,16))}</td>
      <td class="r num">${fmt(x.quantidade)}</td><td class="r num">${brl(x.valor_total)}</td>
      <td><span class="chip ${String(x.prioridade||'').toUpperCase()==='ALTA'?'no':'gy'}">${esc(x.prioridade||'—')}</span></td>

      <td class="mini">${x.previsao_entrega?dbr(x.previsao_entrega):(x.previsao_obs?'<span class="chip wa">'+esc(x.previsao_obs.slice(0,18))+'</span>':'—')}</td>
      ${acts('compras_solicitacoes',x,x.produto)}</tr>`}).join('')
    || '<tr><td colspan="10" class="mini" style="padding:18px">Nenhuma solicitação.</td></tr>'

function drawCPed(){
  const q=($('#fp_q').value||'').toLowerCase(), m=$('#fp_m').value, f=$('#fp_f').value
  let rows=DB.cped.filter(x=>(String(x.produto||'')+String(x.fornecedor||'')+String(x.setor||'')).toLowerCase().includes(q))
  if(m) rows=rows.filter(x=>String(x.data||'').slice(0,7)===m)
  if(f) rows=rows.filter(x=>x.forma_pagamento===f)
  $('#ct_cp').textContent=rows.length
  $('#tb_cp').innerHTML=rows.slice(0,250).map(x=>
    `<tr><td>${dbr(x.data)}</td><td class="mini">${esc(String(x.produto||'').slice(0,36))}</td>
     <td class="mini">${esc(String(x.fornecedor||'—').slice(0,22))}</td>
     <td class="mini">${esc(String(x.setor||'—').slice(0,18))}</td>

/* ---------- SETOR LABORATÓRIO (7 sessões) ---------- */
const mesAtual=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function diasUteis(ini,fim){let n=0;const d=new Date(ini)
  while(d<=fim){const w=d.getDay();if(w!==0&&w!==6)n++;d.setDate(d.getDate()+1)}return n}
/* ===================== ESCALA DE FIM DE SEMANA (Estoque, CQ, Lab) ===================== */
var ESC_SETOR=null   // 'estoque' | 'qualidade' | 'lab' (definido ao entrar)
var ESC_ANO=new Date().getFullYear()
var ESC_MES=new Date().getMonth()+1   // 1..12
var ESC_DIAS={}      // {'2026-08-02':['Fulano'], ...}
var ESC_FERIADOS=[]  // ['2026-08-15', ...] feriados manuais deste mês
var ESC_POR=1        // funcionários por plantão (modo automático)
var ESC_FUNCS=[]     // funcionários do setor (carregados do banco)
var ESC_MESNOME=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
var ESC_DIASEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']
// feriados nacionais fixos do Brasil (mm-dd). Móveis (Páscoa/Carnaval/Corpus Christi) o líder marca manual.
var ESC_FERIADOS_FIXOS={
  '01-01':'Ano Novo','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência',
  '10-12':'N. Sra. Aparecida','11-02':'Finados','11-15':'Proclamação da República','12-25':'Natal'
}
function escSetorNome(k){ return k==='estoque'?'Estoque':(k==='qualidade'?'Controle de Qualidade':'Laboratório') }
function escISO(ano,mes,dia){ return ano+'-'+('0'+mes).slice(-2)+'-'+('0'+dia).slice(-2) }
function escDiasNoMes(ano,mes){ return new Date(ano,mes,0).getDate() }
function escDiaSemana(ano,mes,dia){ return new Date(ano,mes-1,dia).getDay() } // 0=dom..6=sáb
// é feriado (fixo nacional OU marcado manual)?
function escEhFeriado(iso){
  if(ESC_FERIADOS.indexOf(iso)>=0) return true
  var mmdd=iso.slice(5)
  return !!ESC_FERIADOS_FIXOS[mmdd]
}
function escNomeFeriado(iso){
  var mmdd=iso.slice(5)
  if(ESC_FERIADOS_FIXOS[mmdd]) return ESC_FERIADOS_FIXOS[mmdd]
  if(ESC_FERIADOS.indexOf(iso)>=0) return 'Feriado'
  return ''
}
// é dia de plantão? (sáb=6, dom=0, ou feriado)
function escEhPlantao(ano,mes,dia){
  var dw=escDiaSemana(ano,mes,dia)
  var iso=escISO(ano,mes,dia)
  return dw===0 || dw===6 || escEhFeriado(iso)
}
// lista os "plantões" do mês agrupados por FIM DE SEMANA + feriados avulsos
// retorna [{tipo:'fds'|'feriado', dias:[iso,...], label}]
function escPlantoesDoMes(ano,mes){
  var nd=escDiasNoMes(ano,mes), grupos=[], i, atualFds=null
  for(i=1;i<=nd;i++){
    var dw=escDiaSemana(ano,mes,i), iso=escISO(ano,mes,i)
    var ehFer=escEhFeriado(iso), ehSab=dw===6, ehDom=dw===0
    if(ehSab||ehDom){
      // agrupa sáb+dom no mesmo fim de semana
      if(ehSab){ atualFds={tipo:'fds',dias:[iso],label:'FDS '+('0'+i).slice(-2)}; grupos.push(atualFds) }
      else if(ehDom){
        if(atualFds && atualFds.tipo==='fds' && atualFds.dias.length===1){ atualFds.dias.push(iso) } // dom junto do sáb anterior
        else { atualFds={tipo:'fds',dias:[iso],label:'FDS '+('0'+i).slice(-2)}; grupos.push(atualFds) }
      }
    } else if(ehFer){
      grupos.push({tipo:'feriado',dias:[iso],label:'Feriado '+('0'+i).slice(-2)}); atualFds=null
    }
  }
  return grupos
}
// ---- carregar/salvar escala ----
window.__crud=window.__crud||{}

function escCarregaFuncs(){
  ESC_FUNCS=(DB.escf||[]).filter(function(f){return f.setor===ESC_SETOR && f.ativo!==false})
    .sort(function(a,b){return (a.ordem||0)-(b.ordem||0) || String(a.nome).localeCompare(String(b.nome))})
}
function escCarregaMes(){
  escCarregaFuncs()
  var reg=(DB.escm||[]).find(function(x){return x.setor===ESC_SETOR && x.ano===ESC_ANO && x.mes===ESC_MES})
  ESC_DIAS=reg?JSON.parse(JSON.stringify(reg.dias||{})):{}
  ESC_FERIADOS=reg?JSON.parse(JSON.stringify(reg.feriados||[])):[]
  ESC_POR=reg&&reg.por_plantao?reg.por_plantao:1
  if(SETOR===ESC_SETOR||['estoque','qualidade','lab'].indexOf(SETOR)>=0){ escRender() }
}
__crud.escMudaMes=function(delta){
  ESC_MES+=delta
  if(ESC_MES<1){ ESC_MES=12; ESC_ANO-- }
  if(ESC_MES>12){ ESC_MES=1; ESC_ANO++ }
  escCarregaMes()
}
// pega a escala do mês ANTERIOR (referência p/ revezamento)
function escMesAnterior(){
  var a=ESC_ANO, m=ESC_MES-1; if(m<1){m=12;a--}
  var reg=(DB.escm||[]).find(function(x){return x.setor===ESC_SETOR && x.ano===a && x.mes===m})
  return reg?(reg.dias||{}):{}
}
// quem pegou o 1º plantão do mês anterior (p/ não repetir na abertura)
function escUltimoDoMesAnterior(){
  var dias=escMesAnterior()
  var chaves=Object.keys(dias).sort()
  if(!chaves.length) return null
  // último plantão preenchido do mês anterior
  for(var i=chaves.length-1;i>=0;i--){ var arr=dias[chaves[i]]; if(arr&&arr.length) return arr[arr.length-1] }
  return null
}
// ---- geração automática com revezamento ----
__crud.escGerarAuto=function(){
  escCarregaFuncs()
  if(!ESC_FUNCS.length){ toast('Cadastre funcionários antes de gerar',false); return }
  var por=Math.max(1,Math.min(ESC_FUNCS.length, ESC_POR|0))
  var grupos=escPlantoesDoMes(ESC_ANO,ESC_MES)
  if(!grupos.length){ toast('Este mês não tem fins de semana/feriados?',false); return }
  // ordena funcionários; ponto de partida = próximo após quem fechou o mês anterior (revezamento)
  var nomes=ESC_FUNCS.map(function(f){return f.nome})
  var start=0
  var ultimo=escUltimoDoMesAnterior()
  if(ultimo){ var idx=nomes.indexOf(ultimo); if(idx>=0) start=(idx+1)%nomes.length }
  // distribui round-robin: cada plantão recebe 'por' nomes consecutivos, avançando o cursor
  var cursor=start, novo={}
  grupos.forEach(function(g){
    var escalados=[]
    for(var k=0;k<por;k++){ escalados.push(nomes[cursor%nomes.length]); cursor++ }
    g.dias.forEach(function(iso){ novo[iso]=escalados.slice() })
  })
  ESC_DIAS=novo
  escRender()
  toast('Escala gerada — '+grupos.length+' plantão(ões), revezando pelo mês anterior')
}
__crud.escLimpar=function(){ ESC_DIAS={}; escRender() }
__crud.escSalvar=async function(){
  var reg=(DB.escm||[]).find(function(x){return x.setor===ESC_SETOR && x.ano===ESC_ANO && x.mes===ESC_MES})
  var payload={setor:ESC_SETOR,ano:ESC_ANO,mes:ESC_MES,dias:ESC_DIAS,feriados:ESC_FERIADOS,por_plantao:ESC_POR,atualizado_em:new Date().toISOString()}
  try{
    if(reg){ var e=(await sb.from('escala_mensal').update(payload).eq('id',reg.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('escala_mensal').insert(payload).select().single(); if(res.error)throw new Error(res.error.message) }
    if(typeof loadAll==='function') await loadAll()
    toast('Escala de '+ESC_MESNOME[ESC_MES]+'/'+ESC_ANO+' salva')
    escCarregaMes()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}
// ---- funcionários (CRUD simples) ----
__crud.escAddFunc=async function(){
  var nome=prompt('Nome do funcionário de sobreaviso:')
  if(!nome||!nome.trim())return
  try{
    var res=await sb.from('escala_funcionarios').insert({setor:ESC_SETOR,nome:nome.trim(),ativo:true,ordem:(ESC_FUNCS.length)}).select().single()

  }catch(err){ toast('Erro: '+err.message,false) }
}

}

__crud.escPDF=function(){

/* ===================== LABORATÓRIO — LANÇAMENTO PELO LÍDER ===================== */
var LABL_MODO=null   // null | 'painel'
var LABL_LIDER='Dairton'   // líder fixo do laboratório
var LABL_DATA=new Date().toISOString().slice(0,10)   // data de produção sendo lançada
var LABL_TIPO='producao'   // 'producao' | 'justificativa'
var LABL_FORM=null
var LABL_JUSTIFS=['FALTA','FÉRIAS','ATESTADO','FOLGA','LICENÇA','TREINAMENTO','OUTRO']
window.__crud=window.__crud||{}
function lablTecnicos(){
  return (DB.ltec||[]).filter(function(t){return t.ativo!==false})
    .sort(function(a,b){return (a.ordem||0)-(b.ordem||0) || String(a.nome).localeCompare(String(b.nome))})
}
__crud.lablEntrar=function(){
  LABL_MODO='painel'; LABL_DATA=new Date().toISOString().slice(0,10); LABL_TIPO='producao'; LABL_FORM=null
  viewLab()
}
__crud.lablSair=function(){ LABL_MODO=null; viewLab() }
// lançamentos de um dia (data de produção)
function lablDoDia(iso){ return (DB.lprod||[]).filter(function(x){return String(x.data||'').slice(0,10)===iso}) }
// técnicos que já têm lançamento no dia (produção OU justificativa)
function lablLancadosNoDia(iso){
  var set={}; lablDoDia(iso).forEach(function(x){ if(x.tecnico)set[x.tecnico]=true }); return set
}
// ---- cadastro de técnicos ----
__crud.lablAddTec=async function(){
  var nome=prompt('Nome do técnico do laboratório:'); if(!nome||!nome.trim())return
  try{
    var res=await sb.from('lab_tecnicos').insert({nome:nome.trim(),ativo:true,ordem:(lablTecnicos().length)}).select().single()

}

__crud.lablSalvarLanc=async function(){
  var f=LABL_FORM; if(!f)return
  var payload={data:f.data||null,tecnico:f.tecnico,tipo_registro:f.tipo,
    lancado_por:LABL_LIDER,lancado_em:new Date().toISOString()}
  if(f.tipo==='producao'){
    if(!f.modelo){ toast('Informe o modelo',false); return }
    payload.modelo=f.modelo; payload.tipo=f.tipoItem
    payload.q_modulos=+f.q_modulos||0; payload.q_pixels=+f.q_pixels||0; payload.q_trilhas=+f.q_trilhas||0
    payload.q_ci=+f.q_ci||0; payload.q_mascaras=+f.q_mascaras||0; payload.situacao=f.situacao
    payload.observacao=f.observacao; payload.justificativa=null
  } else {
    payload.justificativa=f.justificativa; payload.observacao=f.observacao
    payload.modelo=null; payload.q_modulos=0; payload.q_pixels=0; payload.situacao=null
  }
  try{
    if(f.id){ var e=(await sb.from('lab_producao').update(payload).eq('id',f.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('lab_producao').insert(payload).select().single(); if(res.error)throw new Error(res.error.message) }
    if(typeof loadAll==='function') await loadAll()
    LABL_FORM=null
    toast((f.tipo==='producao'?'Produção':'Justificativa')+' de '+f.tecnico+(f.id?' atualizada':' lançada'))
    viewLab()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}

      '</div></div>'

  var tabela='<div class="glass sec"><div class="sechead" style="margin-bottom:8px"><h3 style="margin:0">Técnicos do laboratório</h3><div class="sp"></div>'+
    '<button class="addbtn" onclick="__crud.lablAddTec()" style="background:rgba(55,201,138,.14);border:1px solid rgba(55,201,138,.4);color:#5fe0a8">+ Técnico</button></div>'+

function viewLab(){
  if(typeof LABL_MODO!=='undefined' && LABL_MODO==='painel'){ $('#view').innerHTML=lablPainelHTML(); return }
  if(typeof ESC_ATIVO!=='undefined' && ESC_ATIVO==='lab'){ $('#view').innerHTML='<div id="esc_wrap"></div>'; escRender(); return }
  const M=mesAtual()
  const doMes=DB.lprod.filter(x=>String(x.data||'').slice(0,7)===M)
  const som=(arr,k)=>arr.reduce((a,x)=>a+(+x[k]||0),0)
  const modMes=som(doMes,'q_modulos'), pxMes=som(doMes,'q_pixels')
  const metaObj=DB.lmeta.find(x=>x.mes_ano===M)||DB.lmeta[0]
  const meta=+(metaObj&&metaObj.meta_modulos)||0
  const pct=meta?Math.round(modMes/meta*100):0
  // ritmo x necessario
  const hoje=new Date(), ano=hoje.getFullYear(), mes=hoje.getMonth()
  const ini=new Date(ano,mes,1), fim=new Date(ano,mes+1,0)
  const uteisTotal=diasUteis(ini,fim), uteisPass=diasUteis(ini,hoje)

function ababrev(v){return v}
function drawLProd(){
  const q=($('#fl_q').value||'').toLowerCase(), m=$('#fl_m').value
  let rows=DB.lprod.filter(x=>(String(x.tecnico||'')+String(x.modelo||'')+String(x.observacao||'')).toLowerCase().includes(q))
  if(m) rows=rows.filter(x=>String(x.data||'').slice(0,7)===m)
  $('#ct_lp').textContent=rows.length+' lançamentos'
  $('#tb_lp').innerHTML=rows.slice(0,250).map(x=>
    `<tr><td>${dbr(x.data)}</td><td>${esc(x.tecnico||'—')}</td>
     <td class="mini">${esc(String(x.modelo||'—').slice(0,34))}</td>
     <td><span class="chip gy">${esc(x.tipo||'—')}</span></td>
     <td class="r num">${fmt(x.q_modulos)}</td><td class="r num">${fmt(x.q_pixels)}</td>
     <td class="r num">${fmt(x.q_trilhas)}</td><td class="r num">${fmt(x.q_ci)}</td><td class="r num">${fmt(x.q_mascaras)}</td>
     <td class="mini">${esc(x.situacao||'—')}</td>
     ${acts('lab_producao',x,x.tecnico+' '+dbr(x.data))}</tr>`).join('')
    || '<tr><td colspan="11" class="mini" style="padding:18px">Nenhum lançamento.</td></tr>'
}
function drawPix(){
  // consumo medio/dia nos ultimos 30 dias -> projecao de esgotamento
  const lim=new Date(Date.now()-30*864e5).toISOString().slice(0,10)
  const cons={}
  DB.lprod.filter(x=>String(x.data||'')>=lim).forEach(x=>{
    const md=DB.lmod.find(m=>String(m.modelo).toUpperCase().trim()===String(x.modelo||'').toUpperCase().trim())
    const sku=md&&md.sku_pixel; if(!sku) return
    cons[sku]=(cons[sku]||0)+(+x.q_pixels||0)})
  $('#tb_px').innerHTML=DB.lpix.map(x=>{
    const sl=+x.saldo||0, mi=+x.minimo||0
    const dia=(cons[x.sku]||0)/30
    const ate=dia>0?Math.floor(Math.max(sl-mi,0)/dia):null
    let ch='<span class="chip ok">ok</span>'
    if(sl<=0) ch='<span class="chip no">zerado</span>'
    else if(sl<mi) ch='<span class="chip no">abaixo do mínimo</span>'
    else if(ate!==null&&ate<15) ch='<span class="chip wa">atenção</span>'
    return `<tr><td>${esc(x.sku)}</td><td class="r num" style="color:${sl<mi?'var(--red2)':'inherit'}">${fmt(sl)}</td>
      <td class="r num">${fmt(mi)}</td><td>${ch}</td>
      <td class="mini">${dia>0?(ate!==null?ate+' dias':'—'):'sem consumo'}</td>
      ${acts('lab_pixels',x,x.sku)}</tr>`}).join('')
    || '<tr><td colspan="6" class="mini" style="padding:18px">Nenhum SKU.</td></tr>'
}
function drawFisc(){
  const M=mesAtual()
  const g={}
  DB.lfisc.forEach(f=>{const t=f.tecnico||'—';g[t]=g[t]||{p:0,f:0,dias:[]}
    if(f.presente)g[t].p++;else g[t].f++
    g[t].dias.push({d:f.data,p:f.presente})})
  const prodT={}
  DB.lprod.filter(x=>String(x.data||'').slice(0,7)===M)
    .forEach(x=>{const t=x.tecnico||'—';prodT[t]=(prodT[t]||0)+(+x.q_modulos||0)})
  $('#tb_fs').innerHTML=Object.entries(g).sort((a,b)=>b[1].p-a[1].p).map(([t,v])=>{
    const tot=v.p+v.f, pc=tot?Math.round(v.p/tot*100):0
    const ult=v.dias.sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,12).reverse()
    return `<tr><td>${esc(t)}</td><td class="r num">${v.p}</td><td class="r num">${v.f}</td>
      <td class="r num" style="color:${pc>=90?'var(--grn)':pc>=70?'var(--amber)':'var(--red2)'}">${pc}%</td>
      <td class="r num">${fmt(prodT[t]||0)}</td>
      <td>${ult.map(d=>`<span title="${dbr(d.d)}" style="display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;background:${d.p?'#37c98a':'#ff2b38'}"></span>`).join('')}</td></tr>`}).join('')
    || '<tr><td colspan="6" class="mini" style="padding:18px">Sem registro de fiscalização.</td></tr>'
}

const okSin=v=>!v||/^\s*(OK|OK!|SEM SINISTRO)/i.test(String(v))
const nItens=id=>DB.ditens.filter(x=>x.demanda_id===id).length
function drawEmiss(){
  const q=($('#fe_q').value||'').toLowerCase(), st=$('#fe_st').value
  let rows=DB.dem.filter(x=>(String(x.evento||'')+String(x.conferente||'')).toLowerCase().includes(q))
  if(st==='E') rows=rows.filter(x=>x.status!=='RETORNADA')
  if(st==='R') rows=rows.filter(x=>x.status==='RETORNADA')
  if(st==='S') rows=rows.filter(x=>!okSin(x.sinistros))
  if(st==='C') rows=rows.filter(x=>!x.cq_ok)
  $('#ct_em').textContent=rows.length+' demandas'
  $('#tb_em').innerHTML=rows.slice(0,300).map(x=>
    `<tr><td>${esc(x.evento||'—')}</td>
     <td class="r num">${nItens(x.id)}</td>
     <td class="r num">${fmt(x.total_cases)}</td><td class="r num">${fmt(x.metragem)}</td>
     <td class="mini">${esc(String(x.classificacao||'—').slice(0,26))}</td>
     <td class="mini">${esc(x.servico||'—')}</td>
     <td>${esc(x.conferente||'—')}</td><td>${dbr(x.data_saida)}</td>
     <td>${okSin(x.sinistros)?'<span class="chip ok">ok</span>':'<span class="chip no">sinistro</span>'}</td>
     <td>${x.cq_ok?'<span class="chip ok">✓</span>':'<span class="chip wa">pendente</span>'}</td>
     <td><div class="acts">
       <button class="ico pr" title="Relatório de saída (PDF)" onclick='__crud.relatorio(${JSON.stringify(x).replace(/'/g,"&#39;")})'>&#128424;</button>
       <button class="ico" title="Conferência do CQ" onclick='__crud.openForm("demandas_cq",${JSON.stringify(x).replace(/'/g,"&#39;")})'>&#9998;</button>
       <button class="ico del" title="Excluir demanda" onclick='__crud.delRow("demandas","${x.id}",${JSON.stringify(x.evento||"demanda").replace(/'/g,"&#39;")})'>&#10005;</button>
     </div></td></tr>`).join('')
    || '<tr><td colspan="11" class="mini" style="padding:18px">Nenhuma demanda.</td></tr>'
}
function drawRet(){
  const q=($('#fr_q').value||'').toLowerCase()
  const rows=DB.dem.filter(x=>x.status!=='RETORNADA'&&String(x.evento||'').toLowerCase().includes(q))
  $('#tb_ret').innerHTML=rows.slice(0,120).map(x=>{
    const r=toDate(x.data_retorno)
    let ch='<span class="chip wa">aguardando</span>'
    if(r&&r<HOJE) ch='<span class="chip no">atrasado</span>'
    else if(!x.data_retorno) ch='<span class="chip nt">sem previsão</span>'
    return `<tr><td>${esc(x.evento||'—')}</td><td class="r num">${fmt(x.total_cases)}</td>
      <td>${dbr(x.data_saida)}</td><td>${dbr(x.data_retorno)}</td><td>${ch}</td>
      ${acts('demandas',x,x.evento||'demanda')}</tr>`}).join('')
    || '<tr><td colspan="6" class="mini" style="padding:18px">Nada aguardando retorno.</td></tr>'
}
function drawInv(){
  const q=($('#fv_q').value||'').toLowerCase()
  const rows=DB.itens.filter(x=>String(x.descricao||'').toLowerCase().includes(q))
  $('#tb_inv').innerHTML=rows.slice(0,200).map(x=>{
    const t=(+x.est_bsb||0)+(+x.est_sp||0), dp=(+x.disp_bsb||0)+(+x.disp_sp||0)
    return `<tr><td>${esc(x.descricao)}</td><td><span class="chip gy">${esc(x.categoria||'—')}</span></td>
      <td class="r num">${fmt(t)}</td><td class="r num">${fmt(dp)}</td></tr>`}).join('')
    || '<tr><td colspan="4" class="mini" style="padding:18px">Nenhum item.</td></tr>'
}
function drawAlm(){
  const q=($('#fa_q').value||'').toLowerCase(), t=$('#fa_t').value
  let rows=DB.almox.filter(x=>(String(x.item||'')+String(x.descricao||'')).toLowerCase().includes(q))
  if(t==='z') rows=rows.filter(x=>(+x.saldo||0)<=0)
  $('#tb_alm').innerHTML=rows.slice(0,200).map(x=>{
    const sl=+x.saldo||0
    return `<tr><td>${esc(x.item||'—')}</td><td class="mini">${esc(x.descricao||'—')}</td>
      <td class="mini">${esc(x.modelo||'—')}</td>
      <td>${x.status?`<span class="chip gy">${esc(x.status)}</span>`:'—'}</td>
      <td class="r num" style="color:${sl<=0?'var(--red2)':'inherit'}">${fmt(sl)}</td>
      ${acts('almox_itens',x,x.descricao||x.item)}</tr>`}).join('')
    || '<tr><td colspan="6" class="mini" style="padding:18px">Nenhum item.</td></tr>'
}
function drawProd(){
  $('#tb_prod').innerHTML=DB.prod.slice(0,100).map(x=>
    `<tr><td>${dbr(x.data)}</td><td>${esc(x.responsavel||'—')}</td>
     <td><span class="chip gy">${esc(x.atividade||'—')}</span></td>
     <td class="mini">${esc(String(x.equipamento||'—').slice(0,40))}</td>
     <td class="r num">${fmt(x.quantidade)}</td>
     <td><span class="chip ${x.situacao==='CONCLUIDO'?'ok':x.situacao==='EM ANDAMENTO'?'wa':'gy'}">${esc(x.situacao||'—')}</span></td>
     ${acts('cq_producao',x,x.atividade||'produção')}</tr>`).join('')
    || '<tr><td colspan="7" class="mini" style="padding:18px">Nenhum lançamento ainda. Use “+ Lançar”.</td></tr>'
}
function drawPlan(){
  $('#tb_plan').innerHTML=DB.plan.slice(0,100).map(x=>{
    const at=toDate(x.data_prevista)&&toDate(x.data_prevista)<HOJE&&x.status!=='CONCLUIDO'
    return `<tr><td>${esc(x.tarefa||'—')}</td><td class="mini">${esc(x.evento||'—')}</td>
      <td>${esc(x.responsavel||'—')}</td>
      <td>${dbr(x.data_prevista)}${at?' <span class="chip no">venceu</span>':''}</td>
      <td><span class="chip ${x.prioridade==='ALTA'?'no':x.prioridade==='BAIXA'?'gy':'wa'}">${esc(x.prioridade||'—')}</span></td>
      <td><span class="chip ${x.status==='CONCLUIDO'?'ok':x.status==='EM ANDAMENTO'?'wa':'gy'}">${esc(x.status||'—')}</span></td>
      ${acts('cq_planejamento',x,x.tarefa||'tarefa')}</tr>`}).join('')
    || '<tr><td colspan="7" class="mini" style="padding:18px">Nenhuma tarefa. Use “+ Nova tarefa”.</td></tr>'
}

function faltResetForm(){
  FALT={ id:null, evento:'', data_saida:'', data_volta:'', comercial:'', cliente:'',
    itens: FALTAS_CAT.map(function(x){
      if('c' in x) return {cat:x.c, header:true}
      return {desc:x.d, valor:x.v, qtd:0, header:false, catAtual:true}
    })}
  // marca a categoria de cada item
  var catAtual=''
  FALT.itens.forEach(function(it){ if(it.header){catAtual=it.cat} else {it.categoria=catAtual} })
}
function faltTotalGeral(){
  var t=0; FALT.itens.forEach(function(it){ if(!it.header){ t+=(+it.qtd||0)*(+it.valor||0) } }); return t
}

    faltLinhasHTML()+'</tbody></table></div></div>'

function faltLinhasHTML(){
  var q=(FALT_FILT.q||'').toLowerCase()
  var out=''
  FALT.itens.forEach(function(it,i){
    if(it.header){
      // só mostra categoria se algum item dela bate no filtro (ou sem filtro)
      if(q){ 
        var temItemVisivel=false
        for(var j=i+1;j<FALT.itens.length && !FALT.itens[j].header;j++){ if(FALT.itens[j].desc.toLowerCase().indexOf(q)>=0){temItemVisivel=true;break} }
        if(it.cat.toLowerCase().indexOf(q)>=0) temItemVisivel=true
        if(!temItemVisivel) return
      }
      out+='<tr><td colspan="5" style="background:#16181d;color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:12px;padding:7px 10px">'+esc(it.cat)+'</td></tr>'
    } else {
      if(q && it.desc.toLowerCase().indexOf(q)<0 && (it.categoria||'').toLowerCase().indexOf(q)<0) return
      var tot=(+it.qtd||0)*(+it.valor||0)
      var destaca=(+it.qtd||0)>0
      out+='<tr'+(destaca?' style="background:rgba(225,6,0,.06)"':'')+'>'+
        '<td><input data-falti="'+i+'|desc" value="'+esc(it.desc)+'" style="width:100%;'+(destaca?'font-weight:700':'')+'"></td>'+
        '<td><input data-falti="'+i+'|qtd" type="number" min="0" value="'+(it.qtd||0)+'" style="width:70px;text-align:center'+(destaca?';font-weight:800;color:#e10600':'')+'"></td>'+
        '<td><input data-falti="'+i+'|valor" type="number" min="0" step="0.01" value="'+(it.valor||0)+'" style="width:110px;text-align:right"></td>'+
        '<td style="text-align:right;font-weight:700" data-falttot="'+i+'">'+fmtBRL(tot)+'</td>'+
        '<td><button class="ico" onclick="__crud.faltDelItem('+i+')" title="Remover">✕</button></td>'+
      '</tr>'
    }
  })
  return out
}
function fmtBRL(v){ v=+v||0; return 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function wireFaltEditor(){
  document.querySelectorAll('[data-falt]').forEach(function(el){el.oninput=function(){FALT[el.getAttribute('data-falt')]=el.value}})
  faltWireLinhas()
  var q=$('#falt_q'); if(q)q.oninput=function(){FALT_FILT.q=q.value;var tb=$('#falt_tbody');if(tb){tb.innerHTML=faltLinhasHTML();faltWireLinhas()}}
}
function faltWireLinhas(){
  document.querySelectorAll('[data-falti]').forEach(function(el){
    el.oninput=function(){
      var p=el.getAttribute('data-falti').split('|'); var i=+p[0], campo=p[1]
      if(campo==='qtd'||campo==='valor'){ FALT.itens[i][campo]=+el.value||0 }
      else { FALT.itens[i][campo]=el.value }
      // atualiza total da linha e geral
      var tot=(+FALT.itens[i].qtd||0)*(+FALT.itens[i].valor||0)
      var tc=document.querySelector('[data-falttot="'+i+'"]'); if(tc)tc.textContent=fmtBRL(tot)
      var tg=$('#falt_total'); if(tg)tg.textContent=fmtBRL(faltTotalGeral())
    }
  })
}

__crud.faltAddItem=function(){
  FALT.itens.push({desc:'',valor:0,qtd:1,header:false,categoria:'ADICIONADOS'})
  var tb=$('#falt_tbody'); if(tb){tb.innerHTML=faltLinhasHTML();faltWireLinhas()}

__crud.faltDelItem=function(i){
  FALT.itens.splice(i,1)
  var tb=$('#falt_tbody'); if(tb){tb.innerHTML=faltLinhasHTML();faltWireLinhas()}

}
__crud.faltSalvar=async function(){
  if(!FALT.evento){ toast('Preencha o nome do evento',false); return }
  // só salva itens com quantidade > 0
  var itensSalvar=FALT.itens.filter(function(it){return !it.header && (+it.qtd||0)>0}).map(function(it){
    return {desc:it.desc, qtd:+it.qtd||0, valor:+it.valor||0, total:(+it.qtd||0)*(+it.valor||0), cat:it.categoria||''}
  })
  if(!itensSalvar.length){ toast('Nenhum item com quantidade preenchida',false); return }
  var payload={evento:FALT.evento,data_saida:FALT.data_saida,data_volta:FALT.data_volta,comercial:FALT.comercial,cliente:FALT.cliente,
    itens:itensSalvar,total_geral:faltTotalGeral(),atualizado_em:new Date().toISOString()}
  try{
    if(FALT.id){ var e=(await sb.from('faltas_eventos').update(payload).eq('id',FALT.id)).error; if(e) throw new Error(e.message) }
    else { var res=await sb.from('faltas_eventos').insert(payload).select().single(); if(res.error) throw new Error(res.error.message); if(res.data&&res.data.id)FALT.id=res.data.id }
    if(typeof loadAll==='function') await loadAll()
    toast('Faltas salvas ('+itensSalvar.length+' itens)'); viewEstoque()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}
__crud.faltAbrir=function(id){
  var v=(DB.falt||[]).find(function(x){return x.id===id}); if(!v) return
  // reconstrói o formulário: começa do catálogo e injeta as quantidades salvas
  faltResetForm()
  FALT.id=v.id; FALT.evento=v.evento||''; FALT.data_saida=v.data_saida||''; FALT.data_volta=v.data_volta||'';
  FALT.comercial=v.comercial||''; FALT.cliente=v.cliente||''
  var salvos=v.itens||[]
  salvos.forEach(function(s){
    // acha item no catálogo por descrição
    var achou=false
    for(var i=0;i<FALT.itens.length;i++){ var it=FALT.itens[i]
      if(!it.header && it.desc===s.desc){ it.qtd=s.qtd; it.valor=s.valor; achou=true; break } }
    if(!achou){ FALT.itens.push({desc:s.desc,valor:s.valor,qtd:s.qtd,header:false,categoria:s.cat||'ADICIONADOS'}) }
  })
  FALT_MODO='editor'; viewEstoque(); toast('Falta #'+id+' carregada')
}

const acts=(t,id,lb)=>`<td><div class="acts">
  <button class="ico" title="Editar" onclick='__crud.openForm("${t}",${JSON.stringify(id).replace(/'/g,"&#39;")})'>&#9998;</button>
  <button class="ico del" title="Excluir" onclick='__crud.delRow("${t}","${id.id}",${JSON.stringify(lb).replace(/'/g,"&#39;")})'>&#10005;</button>
</div></td>`

function drawItens(){
  const q=($('#fi_q').value||'').toLowerCase(), cat=$('#fi_cat').value, st=$('#fi_st').value
  let rows=DB.itens.filter(x=>String(x.descricao||'').toLowerCase().includes(q))
  if(cat) rows=rows.filter(x=>(x.categoria||'').trim()===cat)
  if(st==='z') rows=rows.filter(x=>((+x.disp_bsb||0)+(+x.disp_sp||0))===0)
  if(st==='b') rows=rows.filter(x=>{const t=(+x.est_bsb||0)+(+x.est_sp||0),d=(+x.disp_bsb||0)+(+x.disp_sp||0);return t>0&&d/t<0.2})
  $('#ct_itens').textContent=rows.length+' itens'
  $('#tb_itens').innerHTML=rows.map(x=>{
    const t=(+x.est_bsb||0)+(+x.est_sp||0), d=(+x.disp_bsb||0)+(+x.disp_sp||0)
    const pct=t?Math.round(d/t*100):0
    const cor=pct>50?'#37c98a':pct>20?'#f2b53c':'#ff2b38'
    return `<tr><td>${esc(x.descricao)}</td>
      <td><span class="chip gy">${esc(x.categoria||'—')}</span></td>
      <td class="r num">${fmt(x.est_bsb)}</td><td class="r num">${fmt(x.disp_bsb)}</td>
      <td class="r num">${fmt(x.est_sp)}</td><td class="r num">${fmt(x.disp_sp)}</td>
      <td><div class="bar"><i style="width:${pct}%;background:${cor}"></i></div><span class="mini">${pct}%</span></td>
      ${acts('estoque_itens',x,x.descricao)}</tr>`}).join('')
    || '<tr><td colspan="8" class="mini" style="padding:18px">Nenhum item encontrado.</td></tr>'
}
function drawFora(){
  const q=($('#fo_q').value||'').toLowerCase()
  const rows=DB.ditens.filter(x=>{
    const dm=x.demandas||{}
    return (String(dm.evento||'')+String(x.equipamento||'')).toLowerCase().includes(q)})
  $('#tb_fora').innerHTML=rows.slice(0,250).map(x=>{
    const dm=x.demandas||{}, r=toDate(dm.data_retorno)
    let ch='<span class="chip wa">fora</span>'
    if(dm.status==='RETORNADA') ch='<span class="chip ok">retornada</span>'
    else if(!dm.data_retorno) ch='<span class="chip nt">sem previsão</span>'
    else if(r&&r<HOJE) ch='<span class="chip no">atrasado</span>'
    const qt = x.quantidade==null ? '<span class="chip wa">contar</span>' : fmt(x.quantidade)
    return `<tr><td>${esc(dm.evento||'—')}</td>
      <td class="mini">${esc(String(x.equipamento).slice(0,44))}</td>
      <td class="r num">${qt}</td>
      <td><span class="chip gy">${esc(x.tipo_item||'—')}</span></td>
      <td>${dbr(dm.data_saida)}</td><td>${dbr(dm.data_retorno)}</td><td>${ch}</td>
      ${acts('demanda_itens',x,x.equipamento)}</tr>`}).join('')
    || '<tr><td colspan="8" class="mini" style="padding:18px">Nada fora no momento.</td></tr>'
}
function drawPain(){
  const q=($('#fp_q').value||'').toLowerCase(), b=$('#fp_b').value
  let rows=DB.paineis.filter(x=>String(x.equipamento||'').toLowerCase().includes(q))
  if(b) rows=rows.filter(x=>x.base===b)
  $('#tb_pain').innerHTML=rows.map(x=>`<tr><td>${esc(x.equipamento)}</td>
    <td><span class="chip gy">${esc(x.base||'—')}</span></td>
    <td><span class="chip ${x.ambiente==='OUTDOOR'?'nt':'gy'}">${esc(x.ambiente||'—')}</span></td>
    <td class="r num">${fmt(x.quantidade)}</td><td class="r num">${fmt(x.metragem)}</td>
    ${acts('paineis_metragem',x,x.equipamento)}</tr>`).join('')
    || '<tr><td colspan="6" class="mini" style="padding:18px">Nenhum painel.</td></tr>'
}
function drawSist(){
  const q=($('#fs_q').value||'').toLowerCase()
  const rows=DB.sistema.filter(x=>String(x.equipamento||'').toLowerCase().includes(q))
  $('#tb_sist').innerHTML=rows.map(x=>`<tr><td>${esc(x.equipamento)}</td>
    <td class="r num">${fmt(x.quantidade)}</td><td><span class="chip gy">${esc(x.base||'BSB')}</span></td>
    ${acts('sistema_mainpower',x,x.equipamento)}</tr>`).join('')
    || '<tr><td colspan="4" class="mini" style="padding:18px">Nenhum equipamento.</td></tr>'
}
function drawPar(){
  const q=($('#fz_q').value||'').toLowerCase()
  const rows=DB.parado.filter(x=>String(x.equipamento||'').toLowerCase().includes(q))
  $('#tb_par').innerHTML=rows.map(x=>`<tr><td>${esc(x.equipamento)}</td>
    <td class="r num">${fmt(x.quantidade)}</td><td>${dbr(x.data)}</td><td class="mini">${esc(x.motivo||'—')}</td>
    ${acts('estoque_parado',x,x.equipamento)}</tr>`).join('')
    || '<tr><td colspan="5" class="mini" style="padding:18px">Nada parado.</td></tr>'
}

function wireConsulta(){
  const hoje=new Date().toISOString().slice(0,10)
  $('#q_di').value=hoje
  const d7=new Date(Date.now()+7*864e5).toISOString().slice(0,10); $('#q_df').value=d7
  $('#q_go').onclick=()=>{
    const eq=$('#q_eq').value, qt=+$('#q_qt').value||0, bs=$('#q_bs').value
    const ini=toDate($('#q_di').value), fim=toDate($('#q_df').value)
    const item=DB.itens.find(i=>i.descricao===eq)
    const fisico=estoqueFisico(item,bs)
    const {qtd:fora,lista}=foraNoPeriodo(eq,bs,ini,fim)
    const parado=DB.parado.filter(p=>String(p.equipamento||'').toUpperCase().trim()===eq.toUpperCase().trim())
                          .reduce((a,p)=>a+(+p.quantidade||0),0)
    const disp=fisico-fora-parado
    const ok=disp>=qt
    const out=$('#q_out')
    out.className='verdict on '+(ok?'yes':'non')
    out.innerHTML=`<div class="big" style="color:${ok?'var(--grn)':'var(--red2)'}">
        ${ok?'✓ Disponível':'✕ Indisponível'}</div>
      <div class="mini" style="margin-top:7px;line-height:1.7">
        Pedido: <b>${fmt(qt)}</b> · ${esc(eq)}<br>
        Estoque físico ${bs||'(ambas)'}: <b>${fmt(fisico)}</b><br>
        Fora em evento no período: <b>−${fmt(fora)}</b>${lista.length?` (${lista.length} saída${lista.length>1?'s':''})`:''}<br>
        ${parado?`Estoque parado: <b>−${fmt(parado)}</b><br>`:''}
        <span style="color:${ok?'var(--grn)':'var(--red2)'}">Disponível no período: <b>${fmt(disp)}</b></span>
      </div>
      ${lista.length?`<div style="margin-top:11px"><div class="eyebrow" style="margin-bottom:6px">Conflitos</div>
        ${lista.slice(0,6).map(s=>`<div class="mini">• ${esc(s.evento||'—')} — ${fmt(s.quantidade)} un · ${dbr(s.data_saida)} → ${dbr(s.data_retorno)}</div>`).join('')}
        ${lista.length>6?`<div class="mini">+ ${lista.length-6} outros…</div>`:''}</div>`:''}`
  }
}

window.loadAll=loadAll
loadAll()
</script>
