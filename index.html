  // altura em metros de UMA meia-altura (50cm) e resolução vertical correspondente
  // se o modelo já é 50x50 (dim.h≈0.5): res.h é a res da meia. Se for 50x100 (dim.h≈1.0): res.h/2 é a meia.
  var ehMeia=(m.dim.h<=0.6)
  var resMeiaH = ehMeia? m.res.h : Math.round(m.res.h/2)
  var resW = m.res.w
  var larg = m.dim.w
  // permite override salvo em CP.manual.resOverride
  if(CP.manual && CP.manual.resOverride){
    if(CP.manual.resOverride.w) resW=CP.manual.resOverride.w
    if(CP.manual.resOverride.meiaH) resMeiaH=CP.manual.resOverride.meiaH
  }
  if(tipo==='p100'){ return {tipo:'p100', larg:larg, alt:1.0, resW:resW, resH:resMeiaH*2, unids:2} }
  return {tipo:'p50', larg:larg, alt:0.5, resW:resW, resH:resMeiaH, unids:1}
}
// calcula totais da disposição manual: resolução, consumo relativo, contagem por tipo
function calcManual(){
  var man=CP.manual; if(!man||!man.ativo) return null
  var cols=man.cols, rowsMeia=man.rowsMeia
  var p50=0, p100=0
  var s50=placaSpec(CP.modelo,'p50'), s100=placaSpec(CP.modelo,'p100')
  var pxReais=0   // soma de pixels das placas efetivamente colocadas (proporcional)
  for(var k in man.placas){
    if(k.indexOf('__occ')>=0) continue
    var t=man.placas[k].tipo
    if(t==='p100'){ p100++; pxReais+=s100.resW*s100.resH }
    else if(t==='p50'){ p50++; pxReais+=s50.resW*s50.resH }
  }
  var resW=cols*s50.resW
  var resH=rowsMeia*s50.resH        // resolução da grade cheia (referência de bounding box)
  var totalUnids=p50*1+p100*2       // em unidades de meia-altura (50x100=2)
  return {cols:cols,rowsMeia:rowsMeia,p50:p50,p100:p100,totalPlacas:p50+p100,
    resW:resW,resH:resH,totalPx:pxReais,unidsMeia:totalUnids,specMeia:s50,
    specP50:s50,specP100:s100}
}
function ordemPlacas(cabsW,cabsH,cfgS){
  // cfgS: {inicio:'TL'|'TR'|'BL'|'BR', orient:'V'|'H', padrao:'serp'|'z'}
  var inicio=(cfgS&&cfgS.inicio)||'TL', orient=(cfgS&&cfgS.orient)||'V', padrao=(cfgS&&cfgS.padrao)||'serp'
  var seq=[]
  function pushCol(c, deBaixo){ if(deBaixo){for(var r=cabsH-1;r>=0;r--)seq.push({r:r,c:c})} else {for(var r=0;r<cabsH;r++)seq.push({r:r,c:c})} }
  function pushRow(r, daDireita){ if(daDireita){for(var c=cabsW-1;c>=0;c--)seq.push({r:r,c:c})} else {for(var c=0;c<cabsW;c++)seq.push({r:r,c:c})} }
  var esq=(inicio==='TL'||inicio==='BL'), topo=(inicio==='TL'||inicio==='TR')
  if(orient==='V'){
    for(var i=0;i<cabsW;i++){
      var c=esq?i:(cabsW-1-i)
      var deBaixo
      if(padrao==='serp'){ deBaixo=topo?(i%2===1):(i%2===0) }
      else { deBaixo=!topo } // Z sempre mesma direção
      pushCol(c,deBaixo)
    }
  } else {
    for(var j=0;j<cabsH;j++){
      var r=topo?j:(cabsH-1-j)
      var daDireita
      if(padrao==='serp'){ daDireita=esq?(j%2===1):(j%2===0) }
      else { daDireita=!esq }
      pushRow(r,daDireita)
    }
  }
  return seq
}
function signalRoutingCfg(cabsW,cabsH,cabsPerPort,cfgS){
  var seq=ordemPlacas(cabsW,cabsH,cfgS)
  var cells={}, port=0
  for(var i=0;i<seq.length;i+=cabsPerPort){
    var ch=seq.slice(i,i+cabsPerPort)
    for(var k=0;k<ch.length;k++){ cells[ch[k].r+'_'+ch[k].c]={port:port,order:k} }
    port++
  }
  return {cells:cells,ports:port,seq:seq}
}
/* compat: assinatura antiga usada em outros pontos */
function signalRouting(cabsW,cabsH,cabsPerPort){
  return signalRoutingCfg(cabsW,cabsH,cabsPerPort,{inicio:'TL',orient:'V',padrao:'serp'})
}
/* ---- AC: consumo interativo. Tensão 127/220/380, máx + média, ampères (trifásico ÷3), KVA, disjuntor a 80% ---- */
function calcAC(r, acCfg){
  // acCfg: {volt, fase:'mono'|'tri', fpAtivo:%(0..1) p/ média, disjuntorA}
  var volt=+(acCfg&&acCfg.volt||220)
  var fase=(acCfg&&acCfg.fase)||'mono'
  var fatorMedia=(acCfg&&acCfg.fatorMedia!=null)?acCfg.fatorMedia:0.35 // média ~35% do máx
  var pf=(acCfg&&acCfg.pf!=null)?acCfg.pf:0.9 // fator de potência p/ KVA
  var disj=+(acCfg&&acCfg.disjuntorA||20)
  var wMax=r.totalW
  var wMed=Math.round(wMax*fatorMedia)
  var divFase=(fase==='tri')?3:1
  var ampMax=wMax/volt/divFase
  var ampMed=wMed/volt/divFase
  var kvaMax=(wMax/pf)/1000
  var kvaMed=(wMed/pf)/1000
  // disjuntor: carga contínua = 80% do nominal
  var ampUtil=disj*0.8
  var placasPorDisj=Math.max(1, Math.floor(ampUtil / ((r.m.maxW/volt/divFase)||1)))
  var circuitos=Math.ceil(r.totalCabs/placasPorDisj)
  return {volt:volt,fase:fase,divFase:divFase,wMax:wMax,wMed:wMed,ampMax:ampMax,ampMed:ampMed,
    kvaMax:kvaMax,kvaMed:kvaMed,pf:pf,fatorMedia:fatorMedia,disj:disj,ampUtil:ampUtil,
    placasPorDisj:placasPorDisj,circuitos:circuitos}
}
function acRoutingN(cabsW,cabsH,placasPorCirc){
  const cells={}; let circuit=0,count=0
  for(let r=cabsH-1;r>=0;r--) for(let c=0;c<cabsW;c++){
    if(count===placasPorCirc){circuit++;count=0}
    cells[r+'_'+c]={circuit,order:count}; count++
  }
  return {cells,circuits:circuit+1}
}
function acRouting(cabsW,cabsH,cabsPerAC){ return acRoutingN(cabsW,cabsH,cabsPerAC) }
/* ===== CALCULADORA DE CUSTO — motor ===== */
const TRUCKS=["HD78","Iveco 230","Volvo VM270","Iveco 240","Axor","Scania"]
const CAPT={HD78:50,"Iveco 230":130,"Volvo VM270":140,"Iveco 240":160,Axor:300,Scania:370}
const CCD={HD78:2.50,"Iveco 230":3.00,"Volvo VM270":3.20,"Iveco 240":3.20,Axor:4.00,Scania:4.50}
const CCF={HD78:200,"Iveco 230":300,"Volvo VM270":350,"Iveco 240":350,Axor:500,Scania:600}
function allowedTrucks(base,dist){
  if(dist<=cfg('limiar_km',80)) return base==='SP'?["HD78","Volvo VM270"]:["Iveco 230","Iveco 240"]
  return TRUCKS.slice()
}
function calcCusto(i){
  const LIM=cfg('limiar_km',80), DV=cfg('diaria_viagem',100), DL=cfg('diaria_local',70)
  const HOSP=cfg('hosp_dia',200), GAS=cfg('preco_gasolina',7)
  const CONS={VAN:cfg('consumo_van',7),SPIN:cfg('consumo_spin',10),CARRO:cfg('consumo_carro',10)}
  const b=i.base==='SP'?'sp':'brasilia'
  const rate={Motorista:cfg('cache_'+b+'_motorista',70),Tecnico:cfg('cache_'+b+'_tecnico',b==='sp'?300:200),
    Auxiliar:cfg('cache_'+b+'_auxiliar',100),Freelancer:cfg('cache_'+b+'_freelancer',350),
    Operacao:cfg('cache_'+b+'_operacao',500)}
  const dias=Math.max(1,+i.dias||1)
  const isViagem=(+i.distP||0)>LIM, diaria=isViagem?DV:DL
  const pes=(+i.mot||0)+(+i.tec||0)+(+i.aux||0)+(+i.fre||0)+(+i.ope||0)
  const ci={Motorista:(+i.mot||0)*rate.Motorista,Tecnico:(+i.tec||0)*rate.Tecnico,
    Auxiliar:(+i.aux||0)*rate.Auxiliar,Freelancer:(+i.fre||0)*rate.Freelancer,
    Operacao:(+i.ope||0)*rate.Operacao}
  const cacheBase=Object.values(ci).reduce((a,v)=>a+v,0)
  const cacheTotal=cacheBase*(i.cachePorDia?dias:1)
  const diariasTotal=pes*diaria*dias
  const hosp=i.hospedagem?pes*HOSP*dias:0
  const consP=CONS[i.veicP]||1
  const fuelP=(+i.qVeicP||0)>0?(+i.qVeicP)*(((+i.distP||0)*2)/consP)*GAS:0
  const carRent=(i.veicP==='CARRO')?(+i.qVeicP||0)*(+i.carRent||0)*dias:0
  const fretePrinc=(+i.qTruckP||0)*(((+i.distP||0)*2*(+i.ccdP||0))+(+i.ccP||0))
  const pedagios=(+i.pedP||0)
  const total=cacheTotal+diariasTotal+hosp+fuelP+carRent+fretePrinc+pedagios
  return {isViagem,diaria,dias,pessoas:pes,cacheItens:ci,cacheTotal,diariasTotal,hosp,
    combustivel:fuelP,locacaoCarro:carRent,frete:fretePrinc,pedagios,total,rate}
}

  $('#modal').style.maxWidth='760px'
  $('#modal').innerHTML=html; $('#mask').classList.add('on')
  const listaItens=()=>{
    const f=($('#cf_bq').value||'').toLowerCase()
    const rows=DB.cpre.filter(p=>String(p.item).toLowerCase().includes(f))
    $('#cf_itens').innerHTML=rows.slice(0,300).map(p=>{
      const q=CONF.qty[p.item]||''
      const t=(+q||0)*(+p.valor_unit||0)
      return `<tr><td class="mini">${esc(String(p.item).slice(0,46))}</td>
        <td class="r num">${brl(p.valor_unit)}</td>
        <td class="r"><input type="number" min="0" value="${q}" placeholder="0"
          data-item="${esc(p.item)}" class="cfq" style="width:66px;text-align:right"></td>
        <td class="r num" style="color:${t?'var(--amber)':'var(--mut)'}">${t?brl(t):'—'}</td></tr>`}).join('')
      ||'<tr><td colspan="4" class="mini" style="padding:14px">Nenhum item.</td></tr>'
    document.querySelectorAll('.cfq').forEach(i=>i.oninput=()=>{
      CONF.qty[i.dataset.item]=i.value; recalc(); listaItens()
      const el=document.querySelector(`.cfq[data-item="${CSS.escape(i.dataset.item)}"]`)
      if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}})
  }
  const recalc=()=>{
    const t=Object.entries(CONF.qty).reduce((a,[it,q])=>{
      const p=DB.cpre.find(x=>x.item===it); return a+((+q||0)*(p?+p.valor_unit||0:0))},0)
    $('#cf_tot').textContent=brl(t); return t}
  listaItens(); $('#cf_bq').oninput=listaItens
  $('#cf_cancel').onclick=()=>{$('#modal').style.maxWidth='';closeForm()}
  $('#cf_save').onclick=async()=>{
    const ev=$('#cf_ev').value.trim()
    if(!ev) return toast('Preencha o nome do evento',false)
    const itens=Object.entries(CONF.qty).filter(([,q])=>+q>0)
      .map(([it,q])=>{const p=DB.cpre.find(x=>x.item===it)
        const vu=p?+p.valor_unit||0:0
        return {item:it,quantidade:+q,valor_unit:vu,total:+q*vu}})
    if(!itens.length) return toast('Informe ao menos uma quantidade',false)
    const total=itens.reduce((a,x)=>a+x.total,0)
    $('#cf_save').disabled=true
    try{
      const {data,error}=await sb.from('conf_conferencias').insert({
        evento:ev,data_saida:$('#cf_ds').value||null,data_volta:$('#cf_dv').value||null,
        comercial:$('#cf_cm').value||null,cliente:$('#cf_cl').value||null,
        total,status:'LANCADA'}).select().single()
      if(error) throw new Error(error.message)
      const {error:e2}=await sb.from('conf_itens')
        .insert(itens.map(x=>({...x,conferencia_id:data.id})))
      if(e2) throw new Error(e2.message)
      $('#modal').style.maxWidth=''; closeForm()
      toast('Conferência salva · '+brl(total))
      await loadAll()
      reciboFalta(data.id)
    }catch(ex){ $('#cf_save').disabled=false; toast('Erro: '+ex.message,false) }
  }
}

const SEC_SEL={}          // lembra a sessão escolhida em cada setor
function montarSubmenu(){
  // calculadoras ficam lado a lado: o resultado precisa aparecer junto do formulário
  if(SETOR==='ccusto'||SETOR==='cpainel') return
  const view=$('#view')
  const cols=view.querySelector('.cols')
  if(!cols) return
  const secs=[...cols.children].filter(e=>e.classList&&e.classList.contains('sec'))
  if(secs.length<2) return
  // topo (KPIs, filtros) fica sempre visível, acima do submenu
  const topo=[...view.children].filter(e=>e!==cols)
  const titulos=secs.map((s,i)=>{
    const t=s.querySelector('.sechead h3')
    return t?t.textContent.trim():('Seção '+(i+1))
  })
  const wrap=document.createElement('div'); wrap.className='setor-wrap'
  const nav=document.createElement('nav'); nav.className='submenu'
  const body=document.createElement('div'); body.className='setor-body'
  nav.innerHTML='<div class="grp"><i></i>Sessões</div>'+titulos.map((t,i)=>
    `<button data-s="${i}"><span class="nm">${String(i+1).padStart(2,'0')}</span>
      <span class="tt">${esc(t)}</span></button>`).join('')
  secs.forEach(s=>{s.classList.remove('span2'); body.appendChild(s)})
  wrap.appendChild(nav); wrap.appendChild(body)
  cols.replaceWith(wrap)
  const escolhe=i=>{
    SEC_SEL[SETOR]=i
    body.querySelectorAll(':scope > section').forEach((s,k)=>s.classList.toggle('on',k===i))
    nav.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i))
  }
  nav.onclick=e=>{const b=e.target.closest('button');if(b)escolhe(+b.dataset.s)}
  const ini=Math.min(SEC_SEL[SETOR]||0, secs.length-1)
  escolhe(ini)
}

function flxDef(tipo){ return tipo==='fop'?FLX_FOP:FLX_EVENTO }
// ---- Engine do fluxograma (visual + interação) ----
var FLX_MODO=null     // null | 'evento' | 'fop'
var FLX_EF=null       // evento fechado vinculado {id, numero, nome}
var FLX_PROG={}       // progresso {n:{feito,resp,nota,data}}
var FLX_SEL=null      // etapa aberta no painel
window.__crud=window.__crud||{}
__crud.flxAbrir=function(tipo, efId){
  FLX_MODO=tipo
  var ef=efId?(DB.evf||[]).find(function(x){return x.id===efId}):null
  FLX_EF=ef?{id:ef.id,numero:ef.ef_numero,nome:ef.nome}:null
  // carrega progresso salvo
  var reg=(DB.flx||[]).find(function(x){return x.fluxo===tipo && ((FLX_EF&&x.ef_id===FLX_EF.id)||(!FLX_EF&&!x.ef_id))})
  FLX_PROG=reg?JSON.parse(JSON.stringify(reg.etapas||{})):{}
  FLX_SEL=null
  viewEvFechado()
}
__crud.flxVoltar=function(){ FLX_MODO=null; FLX_SEL=null; viewEvFechado() }
function flxProgOf(n){ return FLX_PROG[n]||{} }
function flxFeito(n){ return !!(FLX_PROG[n]&&FLX_PROG[n].feito) }
// "atual" = primeira etapa não-feita; anteriores feitas destravam as próximas
function flxAtual(def){ for(var i=0;i<def.length;i++){ if(!flxFeito(def[i].n)) return def[i].n } return null }
function flxProgresso(def){ var f=0; def.forEach(function(e){if(flxFeito(e.n))f++}); return {feitas:f,total:def.length,pct:Math.round(f/def.length*100)} }
function flxHTML(){
  var def=flxDef(FLX_MODO)
  var atual=flxAtual(def)
  var pr=flxProgresso(def)
  var tituloFluxo=FLX_MODO==='fop'?'Fluxograma Operacional de Processos (FOP)':'Fluxograma de Evento'
  // cabeçalho
  var alvo=FLX_EF?('<span class="chip nt">'+esc(FLX_EF.numero||'')+'</span> '+esc(FLX_EF.nome||'')):'<span class="chip">Modelo (sem evento vinculado)</span>'
  var cab='<div class="row" style="margin-bottom:14px;align-items:center">'+
    '<button class="btn" onclick="__crud.flxVoltar()" style="background:rgba(255,255,255,.06)">← Voltar</button>'+
    '<h2 style="margin:0 0 0 12px;font-size:20px">'+esc(tituloFluxo)+'</h2>'+
    '<div class="sp" style="flex:1"></div>'+alvo+'</div>'
  // barra de progresso
  var barra='<div class="glass sec" style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:12px">'+
    '<div style="flex:1;height:12px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden">'+
      '<div style="width:'+pr.pct+'%;height:100%;background:linear-gradient(90deg,#e10600,#ff6b3d);transition:width .4s"></div></div>'+
    '<div style="font-weight:800;font-size:18px;min-width:56px;text-align:right">'+pr.pct+'%</div>'+
    '<div class="mini" style="opacity:.7">'+pr.feitas+' de '+pr.total+' etapas</div>'+
    (FLX_EF?'<button class="btn p" onclick="__crud.flxSalvar()" style="padding:7px 14px">💾 Salvar</button>':'')+
    '<button class="btn" onclick="__crud.flxImprimir()" style="padding:7px 14px;background:rgba(255,255,255,.06)">🖨</button>'+
    '</div></div>'
  // legenda das trilhas
  var legenda='<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px">'+
    Object.keys(FLX_TRILHAS).filter(function(k){return k!=='decisao'}).map(function(k){var t=FLX_TRILHAS[k]
      return '<div style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:14px;height:14px;border-radius:4px;background:'+t.cor+'"></span>'+esc(t.nome)+'</div>'}).join('')+'</div>'
  // grade de etapas (cards)
  var cards=def.map(function(e){
    var feito=flxFeito(e.n), ehAtual=(e.n===atual)
    var bloq=!feito && !ehAtual && atual!==null && e.n>atual
    var tr=FLX_TRILHAS[e.tr]||FLX_TRILHAS.operacional
    var prog=flxProgOf(e.n)
    var opacity=bloq?'0.42':'1'
    var borda=feito?tr.cor:(ehAtual?'#fff':'rgba(255,255,255,.10)')
    var glow=ehAtual?'box-shadow:0 0 0 2px rgba(255,255,255,.25),0 6px 22px rgba(0,0,0,.4);':''
    var check=feito?'<div style="position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:'+tr.cor+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800">✓</div>':''
    var decBadge=e.dec?'<div style="font-size:9.5px;color:'+FLX_TRILHAS.decisao.cor+';margin-top:4px;font-style:italic">◈ '+esc(e.dec)+'</div>':''
    var respTag=prog.resp?('<div style="font-size:10px;opacity:.8;margin-top:4px">👤 '+esc(prog.resp)+'</div>'):''
    return '<div class="flx-card" data-flxn="'+e.n+'" style="position:relative;cursor:pointer;background:'+tr.corBg+';border:1.5px solid '+borda+';border-radius:12px;padding:12px 14px;opacity:'+opacity+';'+glow+'transition:all .2s">'+
      check+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:24px;height:24px;border-radius:7px;background:'+tr.cor+';color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+e.n+'</span>'+
      '<span style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:'+tr.cor+';font-weight:700">'+esc(tr.nome)+'</span></div>'+
      '<div style="font-weight:600;font-size:13px;line-height:1.3">'+esc(e.t)+'</div>'+
      decBadge+respTag+'</div>'
  }).join('')
  var grade='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px">'+cards+'</div>'
  // painel lateral de detalhes (se etapa selecionada)
  var painel=FLX_SEL!==null?flxPainelHTML():''
  return cab+barra+legenda+grade+painel
}

  var def=flxDef(FLX_MODO)
  var e=def.find(function(x){return x.n===FLX_SEL}); if(!e)return ''
  var tr=FLX_TRILHAS[e.tr]||FLX_TRILHAS.operacional
  var prog=flxProgOf(e.n)
  return '<div style="position:fixed;inset:0;background:rgba(4,6,12,.72);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)__crud.flxFechar()">'+

    '<div style="padding:18px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px">'+

      '<div style="flex:1"><div style="font-weight:800;font-size:15px">'+esc(e.t)+'</div><div style="font-size:11px;color:'+tr.cor+';text-transform:uppercase;font-weight:700">'+esc(tr.nome)+'</div></div>'+
      '<button class="ico" onclick="__crud.flxFechar()" style="font-size:18px">✕</button></div>'+
    '<div style="padding:20px">'+
      '<div class="mini" style="opacity:.85;margin-bottom:14px;line-height:1.5">'+esc(e.d||'')+'</div>'+
      (e.dec?'<div style="font-size:12px;color:'+FLX_TRILHAS.decisao.cor+';margin-bottom:14px;font-style:italic">◈ Decisão: '+esc(e.dec)+'</div>':'')+
      '<label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px;background:'+(prog.feito?tr.corBg:'rgba(255,255,255,.03)')+';border:1px solid '+(prog.feito?tr.cor:'var(--bd)')+';border-radius:10px;margin-bottom:14px">'+
        '<input type="checkbox" id="flx_feito" '+(prog.feito?'checked':'')+' style="width:20px;height:20px"> <span style="font-weight:700">Etapa concluída</span></label>'+
      '<div class="f" style="margin-bottom:10px"><label>Responsável</label><input id="flx_resp" value="'+esc(prog.resp||'')+'" placeholder="Quem executou (preencha)" style="width:100%"></div>'+
      '<div class="f" style="margin-bottom:10px"><label>Data</label><input type="date" id="flx_data" value="'+esc(prog.data||'')+'" style="width:100%"></div>'+
      '<div class="f" style="margin-bottom:16px"><label>Notas</label><textarea id="flx_nota" rows="3" style="width:100%;resize:vertical" placeholder="Observações da etapa">'+esc(prog.nota||'')+'</textarea></div>'+
      '<div style="display:flex;gap:8px"><button class="btn p" onclick="__crud.flxSalvarEtapa()" style="flex:1">Salvar etapa</button>'+
      '<button class="btn" onclick="__crud.flxFechar()" style="background:rgba(255,255,255,.06)">Fechar</button></div>'+
    '</div></div></div>'
}
function wireFlx(){
  document.querySelectorAll('.flx-card').forEach(function(el){el.onclick=function(){ FLX_SEL=+el.getAttribute('data-flxn'); viewEvFechado() }})
}
__crud.flxFechar=function(){ FLX_SEL=null; viewEvFechado() }
__crud.flxSalvarEtapa=function(){
  var n=FLX_SEL; if(n===null)return
  var feito=document.getElementById('flx_feito').checked
  var resp=document.getElementById('flx_resp').value
  var data=document.getElementById('flx_data').value
  var nota=document.getElementById('flx_nota').value
  FLX_PROG[n]={feito:feito,resp:resp,data:data,nota:nota}
  FLX_SEL=null
  if(FLX_EF) __crud.flxSalvar(true)
  else viewEvFechado()
  toast('Etapa '+n+' atualizada')
}
__crud.flxSalvar=async function(silencioso){
  if(!FLX_EF){ toast('Vincule um evento para salvar o progresso',false); return }
  var reg=(DB.flx||[]).find(function(x){return x.fluxo===FLX_MODO && x.ef_id===FLX_EF.id})
  var payload={ef_id:FLX_EF.id,ef_numero:FLX_EF.numero,fluxo:FLX_MODO,etapas:FLX_PROG,atualizado_em:new Date().toISOString()}
  try{
    if(reg){ var e=(await sb.from('fluxo_progresso').update(payload).eq('id',reg.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('fluxo_progresso').insert(payload).select().single(); if(res.error)throw new Error(res.error.message) }
    if(typeof loadAll==='function') await loadAll()
    if(!silencioso) toast('Progresso salvo')
    viewEvFechado()
  }catch(err){ if(!silencioso)toast('Aviso: não salvou ('+err.message+')',false) }
}

function viewEvFechado(){
  if(typeof FLX_MODO!=='undefined' && FLX_MODO){ $('#view').innerHTML=flxHTML(); wireFlx(); return }
  if(EF_MODO==='editor'){ $('#view').innerHTML=efEditorHTML(); wireEfEditor(); return }
  // lista
  var q=(EF_FILT.q||'').toLowerCase()
  var rows=(DB.evf||[]).filter(function(o){return !q||(String(o.nome||'')+String(o.ef_numero||'')+String(o.cidade||'')+String(o.comercial||'')).toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return String(b.criado_em||'').localeCompare(String(a.criado_em||''))})
  var cards=rows.map(function(o){
    var dEvt=o.data_evento_ini?dbr(o.data_evento_ini):'—'
    var stcor=o.status==='concluido'?'ok':(o.status==='em_producao'?'wa':'nt')
    var stlbl=o.status==='concluido'?'concluído':(o.status==='em_producao'?'em produção':'novo')

    var nSet=0; EF_SETORES.forEach(function(s){if(o.setores&&o.setores[s.k]&&o.setores[s.k].acionado)nSet++})
    return '<tr><td><span class="chip nt">'+esc(o.ef_numero||'—')+'</span></td>'+
      '<td style="font-weight:600">'+esc(String(o.nome||'—').slice(0,30))+'</td>'+
      '<td class="mini">'+esc(String(o.cidade||'—').slice(0,18))+'</td>'+
      '<td class="mini">'+dEvt+'</td>'+
      '<td class="mini">'+esc(String(o.comercial||'—').slice(0,16))+'</td>'+
      '<td class="c">'+(nSet?'<span class="chip ok">'+nSet+'/4</span>':'<span class="chip">0/4</span>')+'</td>'+
      '<td class="c"><span class="chip '+stcor+'">'+stlbl+'</span></td>'+
      '<td><button class="addbtn" onclick="__crud.efAbrir('+o.id+')">Abrir</button></td></tr>'
  }).join('')||'<tr><td colspan="8" class="mini" style="padding:14px">Nenhum evento fechado. Clique em "Novo evento fechado".</td></tr>'
  $('#view').innerHTML=
    '<div class="row" style="margin-bottom:14px;align-items:center">'+
      '<h2 style="margin:0;font-size:20px">Evento Fechado</h2>'+
      '<span class="mini" style="opacity:.7;margin-left:10px">Nascedouro da demanda — o comercial fecha, você dispara os setores</span>'+
      '<div class="sp" style="flex:1"></div>'+
      '<button class="btn p" onclick="__crud.efNovo()" style="padding:10px 18px">+ Novo evento fechado</button>'+
    '</div>'+

// ---------- Extração de PDF + reconhecimento ----------
function efExtrairPDF(){
  var f=EF._file, msg=document.getElementById('ef_extmsg')
  if(!f){ toast('Selecione um arquivo primeiro',false); return }
  var nome=(f.name||'').toLowerCase()
  if(nome.slice(-4)==='.txt'){
    var rd=new FileReader(); rd.onload=function(){ efAplicaTexto(rd.result) }; rd.readAsText(f); return
  }
  if(msg)msg.textContent='Lendo PDF…'
  // pdf.js (versão compatível). Carrega sob demanda.
  efCarregaPdfJs(function(pdfjsLib){
    if(!pdfjsLib){ if(msg)msg.textContent='Não consegui ler o PDF aqui. Cole o texto no campo "Descritivo bruto".'; toast('Leitura de PDF indisponível neste navegador — cole o texto manualmente',false); return }
    var rd=new FileReader()
    rd.onload=function(){
      var data=new Uint8Array(rd.result)
      pdfjsLib.getDocument({data:data}).promise.then(function(pdf){
        var partes=[], i
        function lePagina(n){
          return pdf.getPage(n).then(function(page){return page.getTextContent()}).then(function(tc){
            var linha=tc.items.map(function(it){return it.str}).join(' '); partes.push(linha)
          })
        }
        var chain=Promise.resolve()
        for(i=1;i<=pdf.numPages;i++){ (function(n){chain=chain.then(function(){return lePagina(n)})})(i) }
        chain.then(function(){ efAplicaTexto(partes.join('\n')); if(msg)msg.textContent='PDF lido: '+pdf.numPages+' página(s)' })
      }).catch(function(err){ if(msg)msg.textContent='Falha ao ler PDF. Cole o texto no descritivo bruto.'; })
    }
    rd.readAsArrayBuffer(f)
  })
}
var __pdfjs=null
function efCarregaPdfJs(cb){
  if(__pdfjs){ cb(__pdfjs); return }
  if(window.pdfjsLib){ __pdfjs=window.pdfjsLib; cb(__pdfjs); return }
  var s=document.createElement('script')
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.min.js'
  s.onload=function(){ try{ if(window.pdfjsLib){ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.6.347/pdf.worker.min.js'; __pdfjs=window.pdfjsLib; cb(__pdfjs) } else cb(null) }catch(e){cb(null)} }
  s.onerror=function(){ cb(null) }
  document.head.appendChild(s)
}

// reconhecimento heurístico (multi-formato): só preenche o que estiver vazio
function efReconhece(txt){
  var T=txt.replace(/\r/g,'')
  function achar(re){ var m=T.match(re); return m?m[1].trim():'' }
  function setSe(campo,val){ if(val && !EF[campo]) EF[campo]=val }
  // nome
  setSe('nome', achar(/(?:NOME|Nome)\s*:?\s*([^\n]+?)(?:\n|LOCAL|Local)/))
  // local / endereço
  setSe('local_evento', achar(/(?:LOCAL DO EVENTO|LOCAL|Local)\s*:?\s*([^\n]+)/))
  setSe('endereco', achar(/(?:ENDEREÇO|Endereço|Endereco)\s*:?\s*([^\n]+)/))
  // comercial
  setSe('comercial', achar(/(?:COMERCIAL|Comercial)\s*:?\s*([^\n]+)/))
  // responsável / contato
  setSe('responsavel_local', achar(/(?:RESPONS[ÁA]VEL(?:\s+LOCAL)?|Respons[áa]vel)\s*:?\s*([^\n0-9+]+)/))
  var tel=achar(/(\+?55[\s\d().-]{9,}|\(?\d{2}\)?\s?\d{4,5}[-\s]?\d{4})/); setSe('contato_local', tel)
  // pitch
  var pitch=achar(/(?:PIXEL\s?PITCH|Pixel\s?pitch|Pitch)\s*:?\s*(P?\s?\d[\.,]?\d*\s?mm[^\n]*)/i); setSe('pixel_pitch', pitch)
  if(!EF.pixel_pitch){ var p2=achar(/\b(P\s?\d[\.,]?\d*\s?mm)\b/i); setSe('pixel_pitch', p2) }
  // datas: procura rótulos comuns
  function data(re){
    var m=T.match(re); if(!m)return ''
    var d=m[1].match(/(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?/)
    if(!d)return ''
    var ano=d[3]?(d[3].length===2?'20'+d[3]:d[3]):String(new Date().getFullYear())
    return ano+'-'+('0'+d[2]).slice(-2)+'-'+('0'+d[1]).slice(-2)
  }
  setSe('data_entrega', data(/(?:DATA\s+ENTREGA|Data\s+entrega|ENTREGA)\s*:?\s*([^\n]+)/i))
  setSe('data_montagem', data(/(?:MONTAGEM|Montagem)\s*:?\s*([^\n]+)/i))
  setSe('data_desmontagem', data(/(?:DESMONTAGEM|Desmontagem)\s*:?\s*([^\n]+)/i))
  setSe('data_retirada', data(/(?:DATA\s+RETIRADA|Data\s+retirada|RETIRADA)\s*:?\s*([^\n]+)/i))
  // evento (pode ser range "04 a 13/09")
  var ev=achar(/(?:DATA\s+EVENTO|Data\s+evento|EVENTO)\s*:?\s*([^\n]+)/i)
  if(ev){
    var rg=ev.match(/(\d{1,2})\s*a\s*(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?/)
    if(rg){ var an=rg[4]?(rg[4].length===2?'20'+rg[4]:rg[4]):String(new Date().getFullYear())
      setSe('data_evento_ini', an+'-'+('0'+rg[3]).slice(-2)+'-'+('0'+rg[1]).slice(-2))
      setSe('data_evento_fim', an+'-'+('0'+rg[3]).slice(-2)+'-'+('0'+rg[2]).slice(-2)) }
    else { setSe('data_evento_ini', data(/(?:DATA\s+EVENTO|Data\s+evento|EVENTO)\s*:?\s*([^\n]+)/i)) }
  }
  // material: pega linha(s) com m²
  var mat=achar(/(?:MATERIAL|Material)\s*:?\s*([^\n]+)/); setSe('material', mat)
  // disposição
  setSe('disposicao', achar(/(?:DISPOSI[ÇC][ÃA]O|Disposi[çc][ãa]o)\s*:?\s*([^\n]+)/i))
  // processamento
  setSe('processamento', achar(/(?:PROCESSAMENTO|PROCESSADORA|Processamento)\s*:?\s*([^\n]+)/i))
}
// ---------- Disparo aos setores (cria tarefa ligada à demanda) ----------
__crud.efAcionar=async function(setorK){
  if(!EF.id){ toast('Salve o evento antes de disparar os setores',false); return }
  var s=EF_SETORES.filter(function(x){return x.k===setorK})[0]; if(!s)return
  EF.setores[setorK]=EF.setores[setorK]||{}
  var prazo=EF.setores[setorK].prazo||EF.data_montagem||EF.data_entrega||''
  // cria tarefa no painel do setor, ligada à demanda
  var payload={tarefa:'Preparar '+s.nome+' — '+(EF.nome||EF.ef_numero),
    setor:s.setorTarefa, data:prazo||null, prioridade:'ALTA', status:'PENDENTE',
    responsavel:'', detalhes:'Demanda '+(EF.ef_numero||'')+' · '+(EF.nome||'')+' · '+(EF.material||''),
    demanda:EF.ef_numero, ef_id:EF.id}
  try{
    var res=await sb.from('painel_tarefas').insert(payload).select().single()
    if(res.error) throw new Error(res.error.message)
    EF.setores[setorK]={acionado:true, prazo:prazo, tarefa_id:(res.data&&res.data.id)||null}
    await __crud.efSalvar(true)
    if(typeof loadAll==='function') await loadAll()
    toast(s.nome+' acionado — tarefa criada no painel do setor')
    EF_MODO='editor'; viewEvFechado()
  }catch(err){ toast('Erro ao disparar: '+err.message,false) }
}
__crud.efDesacionar=async function(setorK){
  var st=EF.setores&&EF.setores[setorK]; if(!st)return
  // remove a tarefa se existir
  if(st.tarefa_id){ try{ await sb.from('painel_tarefas').delete().eq('id',st.tarefa_id) }catch(_){} }
  EF.setores[setorK]={acionado:false, prazo:st.prazo||''}
  await __crud.efSalvar(true)
  if(typeof loadAll==='function') await loadAll()
  toast('Setor cancelado'); EF_MODO='editor'; viewEvFechado()
}
// ---------- Salvar ----------
__crud.efSalvar=async function(silencioso){
  if(!EF.ef_numero) EF.ef_numero=efProxNumero()
  if(!EF.nome && !silencioso){ toast('Informe ao menos o nome do evento',false); return }
  // upload do PDF, se houver arquivo novo
  var url=EF.arquivo_url, nome=EF.arquivo_nome
  if(EF._file){
    try{
      var ext=(EF._file.name.split('.').pop()||'pdf').toLowerCase()
      var caminho=(EF.ef_numero||'ef').replace(/[^A-Za-z0-9]/g,'')+'_'+Date.now()+'.'+ext
      var up=await sb.storage.from('eventos-fechados').upload(caminho, EF._file)
      if(!up.error){ var pu=sb.storage.from('eventos-fechados').getPublicUrl(caminho); url=(pu.data&&pu.data.publicUrl)||''; nome=EF._file.name }
    }catch(_){}
  }
  var payload={ef_numero:EF.ef_numero,nome:EF.nome,tipo:EF.tipo,local_evento:EF.local_evento,endereco:EF.endereco,cidade:EF.cidade,
    responsavel_local:EF.responsavel_local,contato_local:EF.contato_local,comercial:EF.comercial,
    data_entrega:EF.data_entrega||null,data_montagem:EF.data_montagem||null,data_evento_ini:EF.data_evento_ini||null,
    data_evento_fim:EF.data_evento_fim||null,data_desmontagem:EF.data_desmontagem||null,data_retirada:EF.data_retirada||null,
    pixel_pitch:EF.pixel_pitch,pitch_2opcao:EF.pitch_2opcao,material:EF.material,disposicao:EF.disposicao,
    processamento:EF.processamento,responsabilidades:EF.responsabilidades,descritivo_bruto:EF.descritivo_bruto,
    arquivo_url:url,arquivo_nome:nome,setores:EF.setores,observacoes:EF.observacoes,status:EF.status,
    atualizado_em:new Date().toISOString()}
  try{
    if(EF.id){ var e=(await sb.from('eventos_fechados').update(payload).eq('id',EF.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('eventos_fechados').insert(payload).select().single(); if(res.error)throw new Error(res.error.message); if(res.data&&res.data.id)EF.id=res.data.id }
    EF.arquivo_url=url; EF.arquivo_nome=nome; EF._file=null
    if(!silencioso){ if(typeof loadAll==='function') await loadAll(); toast('Evento '+EF.ef_numero+' salvo'); EF_MODO='editor'; viewEvFechado() }
  }catch(err){ if(!silencioso)toast('Aviso: não salvou ('+err.message+')',false) }
}

/* eventos mais recentes: histórico 2026 + demandas lançadas no sistema */
function eventosRecentes(){
  const lst=[]
  DB.ehist.filter(x=>+x.ano>=2026).forEach(x=>lst.push({
    nome:String(x.nome||'').trim(), ord:(+x.ano||0)*100+(+x.mes||0),
    ref:(MESN[+x.mes]||'')+'/'+x.ano}))
  DB.dem.filter(x=>x.data_saida).forEach(x=>lst.push({
    nome:String(x.evento||'').trim(), ord:+String(x.data_saida).slice(0,4)*100+ +String(x.data_saida).slice(5,7),
    ref:dbr(x.data_saida)}))
  const vistos=new Set(), out=[]
  lst.sort((a,b)=>b.ord-a.ord).forEach(e=>{
    const k=e.nome.toUpperCase()
    if(!e.nome||vistos.has(k))return
    vistos.add(k); out.push(e)})
  return out
}

function wireVT(){
  document.querySelectorAll('[data-vt]').forEach(function(el){el.oninput=function(){VT[el.getAttribute('data-vt')]=el.value}})
  document.querySelectorAll('[data-vtd]').forEach(function(el){el.oninput=function(){var p=el.getAttribute('data-vtd').split('|');VT.datas[+p[0]][p[1]]=el.value}})
  document.querySelectorAll('[data-vtp]').forEach(function(el){el.oninput=function(){var p=el.getAttribute('data-vtp').split('|');VT.perguntas[+p[0]][p[1]]=el.value}})
  document.querySelectorAll('[data-vtr]').forEach(function(el){el.onchange=function(){
    var p=el.getAttribute('data-vtr').split('|'); var i=+p[0], resp=p[1]
    if(el.checked){
      VT.perguntas[i].resposta=resp
      // desmarca o oposto (sim/nao são exclusivos) sem re-renderizar a tela
      var oposto=(resp==='sim')?'nao':'sim'
      var elOp=document.querySelector('[data-vtr="'+i+'|'+oposto+'"]')
      if(elOp) elOp.checked=false
    } else {
      VT.perguntas[i].resposta=null
    }
  }})
  document.querySelectorAll('.vt-tipo').forEach(function(el){el.onclick=function(){
    var tp=el.getAttribute('data-tipo'); VT.tipos[tp]=!VT.tipos[tp]
    var on=VT.tipos[tp]
    // atualiza só o botão clicado, sem reconstruir a tela
    el.style.background=on?'':'rgba(255,255,255,.06)'
    el.style.boxShadow=on?'':'none'
    el.style.color=on?'':'#9aa0ac'
    el.textContent=(on?'☑ ':'☐ ')+tp
  }})
  var q=$('#vt_f_q'); if(q)q.oninput=function(){VT_FILT.q=q.value;var w=$('#vt_hist');if(w)w.innerHTML=vtHistHTML();var q2=$('#vt_f_q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)} var qq=$('#vt_f_q'); if(qq)qq.oninput=arguments.callee}
}

// carga horária a partir de HH:MM (trata virada de meia-noite)
function apoioCarga(ini,fim){
  function toMin(s){ var m=String(s||'').match(/^(\d{1,2}):(\d{2})$/); if(!m)return null; return (+m[1])*60+(+m[2]) }
  var a=toMin(ini), b=toMin(fim); if(a===null||b===null) return ''
  var d=b-a; if(d<0)d+=24*60
  var h=Math.floor(d/60), mn=d%60
  return h+'h'+(mn?(' '+mn+'m'):'')
}

function wireApoio(){
  document.querySelectorAll('[data-ap]').forEach(function(el){el.oninput=function(){APOIO[el.getAttribute('data-ap')]=el.value}})
  apoioWireLinhas()
}
function apoioWireLinhas(){
  document.querySelectorAll('[data-apl]').forEach(function(el){el.oninput=function(){
    var p=el.getAttribute('data-apl').split('|'); var i=+p[0], campo=p[1]
    APOIO.linhas[i][campo]=(campo==='qtd')?(+el.value||0):el.value
    if(campo==='inicio'||campo==='fim'){ var c=document.querySelector('[data-apcarga="'+i+'"]'); if(c)c.textContent=apoioCarga(APOIO.linhas[i].inicio,APOIO.linhas[i].fim)||'—' }
  }})
  // select de recurso
  document.querySelectorAll('[data-apsel]').forEach(function(sel){sel.onchange=function(){
    var i=+sel.getAttribute('data-apsel')
    var inpOutro=document.querySelector('[data-apoutro="'+i+'"]')
    if(sel.value==='__outro__'){
      if(inpOutro){ inpOutro.style.display=''; inpOutro.focus() }
      APOIO.linhas[i].recurso=(inpOutro&&inpOutro.value)||''
    } else {
      if(inpOutro) inpOutro.style.display='none'
      APOIO.linhas[i].recurso=sel.value
    }
  }})
}

__crud.apoioSalvar=async function(){

  var payload={evento:APOIO.evento,local:APOIO.local,produtora:APOIO.produtora,resp_iled:APOIO.resp_iled,
    contato:APOIO.contato,ponto_encontro:APOIO.ponto_encontro,data_inicio:APOIO.data_inicio,data_fim:APOIO.data_fim,
    observacoes:APOIO.observacoes,linhas:linhas,atualizado_em:new Date().toISOString()}
  try{
    if(APOIO.id){ var e=(await sb.from('solicitacoes_apoio').update(payload).eq('id',APOIO.id)).error; if(e)throw new Error(e.message) }

function wirePE(){
  document.querySelectorAll('[data-pe]').forEach(function(el){var k=el.getAttribute('data-pe');el.oninput=function(){PE[k]=el.value};el.onchange=function(){PE[k]=el.value}})
  document.querySelectorAll('[data-peop]').forEach(function(el){el.onchange=function(){PE.operacao[el.getAttribute('data-peop')]=el.checked}})
  document.querySelectorAll('[data-pechk]').forEach(function(el){el.onchange=function(){var p=el.getAttribute('data-pechk').split('|');if(el.checked)PE.checklist[p[0]]=p[1]}})
  document.querySelectorAll('[data-peav]').forEach(function(el){var k=el.getAttribute('data-peav');el.oninput=function(){PE.avaliacao[k]=el.value};el.onchange=function(){PE.avaliacao[k]=el.value}})
  document.querySelectorAll('[data-peoc]').forEach(function(el){el.oninput=function(){var p=el.getAttribute('data-peoc').split('|');PE.ocorrencias[+p[0]][p[1]]=el.value};el.onchange=el.oninput})
  document.querySelectorAll('[data-peeq]').forEach(function(el){el.oninput=function(){var p=el.getAttribute('data-peeq').split('|');PE.equipe[+p[0]][p[1]]=el.value};el.onchange=el.oninput})
  var ff=document.querySelector('[data-pefotos]'); if(ff)ff.onchange=function(){peUploadFotos(ff.files)}
  var q=$('#pe_q'); if(q)q.oninput=function(){PE_FILT.q=q.value;var w=$('#pe_lista');if(w){w.innerHTML=peListaHTML();var q2=$('#pe_q');if(q2){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}}}

function peUploadFotos(files){
  if(!files||!files.length)return
  var msg=document.getElementById('pe_fotomsg'), arr=[].slice.call(files), done=0
  arr.forEach(function(f){var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){
    var mx=800,sc=Math.min(1,mx/Math.max(img.width,img.height));var cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height)
    PE.fotos.push({url:cv.toDataURL('image/jpeg',0.8),nome:f.name});done++;if(msg)msg.textContent=done+' foto(s)';if(done===arr.length){renderProdSub()}
  };img.src=rd.result};rd.readAsDataURL(f)})
}

__crud.peSalvar=async function(){
  if(!PE.rel_numero) PE.rel_numero=peProxNumero()
  var payload={rel_numero:PE.rel_numero,evento:PE.evento,cliente:PE.cliente,produtora:PE.produtora,local_evento:PE.local_evento,cidade:PE.cidade,
    data_montagem:PE.data_montagem||null,data_evento:PE.data_evento||null,data_desmontagem:PE.data_desmontagem||null,
    responsavel_iled:PE.responsavel_iled,contato:PE.contato,painel_modelo:PE.painel_modelo,pitch:PE.pitch,dimensao:PE.dimensao,area_total:PE.area_total,processadora:PE.processadora,
    operacao:PE.operacao,checklist:PE.checklist,ocorrencias:PE.ocorrencias,equipe:PE.equipe,materiais:PE.materiais,avaliacao:PE.avaliacao,fotos:PE.fotos,observacoes:PE.observacoes,
    status:'concluido',atualizado_em:new Date().toISOString()}
  try{
    if(PE.id){ var e=(await sb.from('producao_posevento').update(payload).eq('id',PE.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('producao_posevento').insert(payload).select().single(); if(res.error)throw new Error(res.error.message); if(res.data&&res.data.id)PE.id=res.data.id }
    if(typeof loadAll==='function') await loadAll()
    toast('Relatório '+PE.rel_numero+' salvo'); renderProdSub()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}

        <span class="cnt">${brl(totGeral)} no total</span></div>
      ${(()=>{const ult=meses.slice(0,8).reverse()

function wireUber(){
  $('#pu_mes').onchange=e=>{PRD.mes=e.target.value;renderProdSub()}
  drawUber(); $('#pu_q').oninput=drawUber; $('#pu_c').onchange=drawUber; $('#pu_cp').onchange=drawUber
}

function drawUber(){
  const q=($('#pu_q').value||'').toLowerCase(), c=$('#pu_c').value, cp=$('#pu_cp').value
  let rows=DB.pub.filter(x=>String(x.data||'').slice(0,7)===PRD.mes)
    .filter(x=>(String(x.evento||'')+String(x.passageiro||'')+String(x.observacao||'')).toLowerCase().includes(q))
  if(c) rows=rows.filter(x=>String(x.categoria||'')===c)
  if(cp==='s') rows=rows.filter(x=>x.comprovante_url)
  if(cp==='n') rows=rows.filter(x=>!x.comprovante_url)
  rows.sort((a,b)=>String(b.data||'').localeCompare(String(a.data||'')))
  $('#ct_pu').textContent=rows.length
  const tot=rows.reduce((a,x)=>a+(+x.valor||0),0)
  $('#tb_pu').innerHTML=rows.map(x=>{
    const traj=[x.origem_txt,x.destino_txt].filter(Boolean).join(' → ')
    return `<tr><td>${dbr(x.data)}</td>
      <td class="mini">${esc(String(x.evento||'—').slice(0,24))}</td>
      <td><span class="chip ${x.categoria==='UBER'?'gy':'nt'}">${esc(x.categoria||'—')}</span></td>
      <td class="mini">${esc(traj.slice(0,30))||'—'}</td>
      <td class="mini">${esc(String(x.passageiro||'—').slice(0,14))}</td>
      <td class="mini">${esc(String(x.observacao||'—').slice(0,32))}</td>
      <td class="r num"><b>${brl(x.valor)}</b></td>
      <td>${x.comprovante_url
        ?`<a href="${esc(x.comprovante_url)}" target="_blank" class="chip ok" style="text-decoration:none">ver PDF</a>`
        :'<span class="chip wa">falta</span>'}</td>
      ${acts('prod_uber',x,x.evento+' '+dbr(x.data))}</tr>`}).join('')
    || '<tr><td colspan="9" class="mini" style="padding:18px">Nenhum lançamento no mês.</td></tr>'
  $('#tf_pu').innerHTML=rows.length?`<tr style="background:rgba(225,6,0,.10)">
    <td colspan="6"><b>TOTAL — ${rows.length} corrida(s)</b></td>
    <td class="r num"><b>${brl(tot)}</b></td><td colspan="2"></td></tr>`:''
}

function wireOSEditor(){
  document.querySelectorAll('[data-os]').forEach(function(el){var k=el.getAttribute('data-os')
    el.oninput=function(){OS[k]=el.value}; el.onchange=function(){OS[k]=el.value}})
  document.querySelectorAll('[data-ossv]').forEach(function(el){el.onchange=function(){OS.servicos[el.getAttribute('data-ossv')]=el.checked}})
  document.querySelectorAll('[data-oschk]').forEach(function(el){el.onchange=function(){var p=el.getAttribute('data-oschk').split('|');if(el.checked)OS.checklist[p[0]]=p[1]}})
  document.querySelectorAll('[data-ost]').forEach(function(el){var k=el.getAttribute('data-ost');el.oninput=function(){OS.teste[k]=el.value};el.onchange=function(){OS.teste[k]=el.value}})
  document.querySelectorAll('[data-osp]').forEach(function(el){var k=el.getAttribute('data-osp');el.oninput=function(){OS.pendencias[k]=el.value};el.onchange=function(){OS.pendencias[k]=el.value}})
  document.querySelectorAll('[data-osa]').forEach(function(el){var k=el.getAttribute('data-osa');el.oninput=function(){OS.aceite[k]=el.value};el.onchange=function(){OS.aceite[k]=el.value}})
  var ff=document.querySelector('[data-osfotos]'); if(ff)ff.onchange=function(){osUploadFotos(ff.files)}
}
function osUploadFotos(files){
  if(!files||!files.length)return
  var msg=document.getElementById('os_fotomsg')
  var arr=[].slice.call(files), done=0
  arr.forEach(function(f){
    var rd=new FileReader()
    rd.onload=function(){
      // redimensiona pra ~800px/150KB no browser
      var img=new Image()
      img.onload=function(){
        var mx=800, sc=Math.min(1,mx/Math.max(img.width,img.height))
        var cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc)
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height)
        var dataURL=cv.toDataURL('image/jpeg',0.8)
        OS.fotos.push({url:dataURL,nome:f.name})
        done++; if(msg)msg.textContent=done+' foto(s) adicionada(s)'
        if(done===arr.length){ var w=document.getElementById('os_fotos'); if(w){ OS_MODO='editor'; $('#view').innerHTML=osEditorHTML(); wireOSEditor() } }
      }
      img.src=rd.result
    }
    rd.readAsDataURL(f)
  })
}

__crud.osSalvar=async function(){
  if(!OS.os_numero) OS.os_numero=osProxNumero()
  var payload={os_numero:OS.os_numero,data:OS.data||null,hora_inicio:OS.hora_inicio,hora_fim:OS.hora_fim,
    cliente:OS.cliente,cnpj_cpf:OS.cnpj_cpf,responsavel:OS.responsavel,telefone:OS.telefone,email:OS.email,
    local_inst:OS.local_inst,endereco:OS.endereco,fabricante:OS.fabricante,modelo:OS.modelo,pitch:OS.pitch,
    tipo_tela:OS.tipo_tela,dimensao:OS.dimensao,area_total:OS.area_total,qtd_modulos:OS.qtd_modulos,
    resolucao_total:OS.resolucao_total,resolucao_modulo:OS.resolucao_modulo,tipo_modulo:OS.tipo_modulo,
    processadora:OS.processadora,modelo_proc:OS.modelo_proc,servicos:OS.servicos,checklist:OS.checklist,
    teste:OS.teste,pendencias:OS.pendencias,aceite:OS.aceite,fotos:OS.fotos,
    status:(OS.aceite&&OS.aceite.tecnico_nome)?'concluida':'aberta',atualizado_em:new Date().toISOString()}
  try{
    if(OS.id){ var e=(await sb.from('insfixa_os').update(payload).eq('id',OS.id)).error; if(e)throw new Error(e.message) }
    else { var res=await sb.from('insfixa_os').insert(payload).select().single(); if(res.error)throw new Error(res.error.message); if(res.data&&res.data.id)OS.id=res.data.id }
    if(typeof loadAll==='function') await loadAll()
    toast('OS '+OS.os_numero+' salva'); OS_MODO='editor'; viewInsFixa()
  }catch(err){ toast('Aviso: não salvou ('+err.message+')',false) }
}

function histObra(nome){

    return `<div class="tvcard ${cls}">${tag}<h4>${esc(x.tarefa)}</h4>
      <div class="who">${esc(x.setor||'')}${x.responsavel?' · '+esc(x.responsavel):''}${x.hora?' · '+esc(x.hora):''}</div></div>`}
  // 1. tarefas de hoje
  if(tHoje.length) T.push({t:'Tarefas de hoje',c:tHoje.length+' tarefa(s)',
    h:`<div class="tvgrid" style="grid-template-columns:repeat(2,1fr)">${tHoje.slice(0,8).map(card).join('')}</div>`})
  // 2. semana
  if(tSem.length) T.push({t:'Próximos dias',c:tSem.length+' tarefa(s)',
    h:`<div class="tvgrid" style="grid-template-columns:repeat(2,1fr)">${tSem.slice(0,8).map(card).join('')}</div>`})
  // 3. operação
  const estT=DB.itens.reduce((a,x)=>a+(+x.est_bsb||0)+(+x.est_sp||0),0)
  const estD=DB.itens.reduce((a,x)=>a+(+x.disp_bsb||0)+(+x.disp_sp||0),0)
  const demAb=DB.dem.filter(x=>x.status!=='RETORNADA').length
  const M=mesAtual()

  T.push({t:'Operação agora',c:'ao vivo',

      <div class="tvkpi"><div class="v">${fmt(labM)}</div><div class="k">Módulos no mês</div></div>

    .sort((a,b)=>String(a.data_saida).localeCompare(String(b.data_saida))).slice(0,7)

    h:`<div class="tvgrid">${prox.map(d=>{
      const dd=Math.ceil((toDate(d.data_saida)-HOJE)/864e5)

        <span class="tag" style="background:rgba(255,255,255,.08);color:#cfd3da">
          ${dd===0?'HOJE':dd===1?'AMANHÃ':'EM '+dd+' DIAS'}</span>
        <h4>${esc(d.evento||'')}</h4>
        <div class="who">${esc(d.base||'')}${d.metragem?' · '+fmt(d.metragem)+' m²':''}${d.cidade?' · '+esc(d.cidade):''}</div></div>`}).join('')}</div>`})

  if(avisos.length) T.push({t:'Avisos',c:avisos.length,
    h:avisos.slice(0,4).map(a=>`<div class="tvaviso ${sa(a.tipo||'INFO').toUpperCase()}">
      <h3>${esc(a.titulo)}</h3><p>${esc(a.mensagem||'')}</p></div>`).join('')})

  const fm=DB.pfun[0]
  if(aniv.length||fm) T.push({t:'Nosso time',c:MESL[mesN],
    h:`${fm?`<div class="tvaviso COMEMORACAO" style="margin-bottom:18px">

      ${aniv.length?`<div class="eyebrow" style="margin-bottom:12px;font-size:13px">Aniversariantes de ${MESL[mesN]}</div>

  if(DB.pind.length) T.push({t:'Indicadores',c:'segurança e operação',
    h:`<div class="tvbig">${DB.pind.slice(0,4).map(i=>{
      const dd=i.data_ultimo?Math.floor((HOJE-toDate(i.data_ultimo))/864e5):null

        <div class="k">${esc(String(i.indicador||'').slice(0,26))}</div></div>`}).join('')}</div>`})
  return T.length?T:[{t:'Painel ILED',c:'',h:'<div class="mini" style="font-size:18px">Cadastre tarefas e avisos para aparecerem aqui.</div>'}]
}
function abrirTV(){
  const tv=$('#tv'); TV.idx=0
  const emp=pcfg('Nome da Empresa','ILED PRODUÇÕES')
  const cidade=pcfg('Cidade','Brasília'), uf=pcfg('UF','DF')
  const rot=(+pcfg('Rotacao',20)||20)*1000
  const rec=(+pcfg('Atualizacao',30)||30)*1000
  const telas=telasTV()
  tv.innerHTML=`
    <div class="subpixel">${Array(48).fill('<i></i>').join('')}</div>
    <div class="tvtop">
      <img class="lg" src="${LOGO_PRINT?'':''}" style="display:none">
      <div class="logowrap" style="flex:none"><div class="glow"></div>
        <img src="${document.querySelector('.logowrap img').src}" style="height:52px;position:relative;z-index:1"></div>
      <div class="emp"><b>${esc(emp)}</b><span id="tv_data">—</span></div>
      <div class="sp" style="flex:1"></div>
      <div style="text-align:right"><div class="tvclock" id="tv_hora">--:--<small id="tv_seg">:--</small></div>
        <div class="mini" style="font-size:13px">${esc(cidade)}, ${esc(uf)}</div></div>
      <button class="iconbtn" id="tv_sair" style="margin-left:18px">✕ Sair</button>
    </div>
    <div class="tvbody" id="tv_body">
      ${telas.map((s,i)=>`<div class="tvscr ${i===0?'on':''}" data-i="${i}">
        <div class="tvh"><div class="bar"></div><h2>${esc(s.t)}</h2>
          ${s.c?`<span class="cnt">${esc(String(s.c))}</span>`:''}</div>
        ${s.h}</div>`).join('')}
    </div>
    <div class="tvfoot">
      <div class="tvdots" id="tv_dots">${telas.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>
      <span id="tv_nome">${esc(telas[0].t)}</span>
      <span>·</span><span id="tv_ts">—</span>
    </div>`
  tv.classList.add('on')
  document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})
  const tick=()=>{const d=new Date()
    $('#tv_hora').innerHTML=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
      +`<small>:${String(d.getSeconds()).padStart(2,'0')}</small>`
    $('#tv_data').textContent=DIAS[d.getDay()]+', '+d.getDate()+' de '+MESL[d.getMonth()+1].toLowerCase()}
  tick(); TV.relogio=setInterval(tick,1000)
  const gira=()=>{const n=telas.length; if(n<2)return
    document.querySelectorAll('.tvscr').forEach(e=>e.classList.remove('on'))
    document.querySelectorAll('#tv_dots i').forEach(e=>e.classList.remove('on'))
    TV.idx=(TV.idx+1)%n
    const el=document.querySelector(`.tvscr[data-i="${TV.idx}"]`); if(el)el.classList.add('on')
    const dt=document.querySelectorAll('#tv_dots i')[TV.idx]; if(dt)dt.classList.add('on')
    $('#tv_nome').textContent=telas[TV.idx].t}
  TV.timer=setInterval(gira,rot)
  TV.recarga=setInterval(async()=>{await loadAll(); if($('#tv').classList.contains('on')){
    const i=TV.idx; fecharTV(true); abrirTV(); TV.idx=i}},rec)
  $('#tv_ts').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR').slice(0,5)
  $('#tv_sair').onclick=()=>fecharTV()
  document.onkeydown=e=>{if(e.key==='Escape')fecharTV(); if(e.key==='ArrowRight')gira()}
}
function fecharTV(soLimpa){
  clearInterval(TV.timer);clearInterval(TV.relogio);clearInterval(TV.recarga)
  if(soLimpa)return
  $('#tv').classList.remove('on'); $('#tv').innerHTML=''
  document.fullscreenElement&&document.exitFullscreen&&document.exitFullscreen().catch(()=>{})
  document.onkeydown=null
}
window.__crud.abrirTV=abrirTV

/* --- mapa do Brasil (contorno geográfico real) --- */
function mapaBrasil(dados,unidade='m²'){
  const vals=Object.values(dados).filter(v=>v>0)
  const mx=Math.max(...vals,1)
  let s=`<svg viewBox="0 0 613 639" style="width:100%;max-width:520px;height:auto;display:block;margin:0 auto"
    xmlns="${svgNS}">`
  // sombra sutil do contorno do país
  s+=`<g>`
  for(const [uf,d] of Object.entries(BR_PATHS)){
    const v=dados[uf]||0, t=v/mx
    const cor=v>0?heatColor(t):'rgba(255,255,255,.045)'
    const brd=v>0?'rgba(255,255,255,.22)':'rgba(255,255,255,.09)'
    s+=`<path d="${d}" fill="${cor}" stroke="${brd}" stroke-width=".8" stroke-linejoin="round"
      style="transition:fill .3s"><title>${uf}: ${fmt(v)} ${unidade}</title></path>`
  }
  s+=`</g>`
  // rótulos: estado grande recebe o nome dentro; pequeno ganha marcador e etiqueta ao lado
  const comDado=Object.entries(dados).filter(([u,v])=>v>0&&UF_CENTRO[u]).sort((a,b)=>b[1]-a[1])
  const pequenos=[]
  comDado.forEach(([uf,v],i)=>{
    const [x,y,lado]=UF_CENTRO[uf], t=v/mx
    if(!(t>.28||i<7)) return
    const lbl=v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)
    if(lado>=42){
      s+=`<g style="pointer-events:none">
        <text x="${x}" y="${y-1}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff"
          stroke="#08080a" stroke-width="3.4" paint-order="stroke" font-family="system-ui">${uf}</text>
        <text x="${x}" y="${y+13}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff"
          stroke="#08080a" stroke-width="2.8" paint-order="stroke" opacity=".95" font-family="system-ui">${lbl}</text></g>`
    } else pequenos.push([uf,v,x,y,t,lbl])
  })
  // estados pequenos (DF, SE, AL, RJ, ES...) — anel de destaque e etiqueta deslocada
  pequenos.forEach(([uf,v,x,y,t,lbl],k)=>{
    const dx=x>330?52:-52, dy=(k%2?1:-1)*(12+k*9)
    const lx=x+dx, ly=y+dy
    s+=`<g style="pointer-events:none">
      <circle cx="${x}" cy="${y}" r="9" fill="none" stroke="${heatColor(Math.max(t,.55))}" stroke-width="2" opacity=".95"/>
      <line x1="${x+(dx>0?9:-9)}" y1="${y}" x2="${lx-(dx>0?26:-26)}" y2="${ly}"
        stroke="rgba(255,255,255,.4)" stroke-width="1.1"/>
      <rect x="${lx-26}" y="${ly-11}" width="52" height="23" rx="6"
        fill="rgba(8,8,10,.92)" stroke="${heatColor(Math.max(t,.55))}" stroke-width="1.2"/>
      <text x="${lx}" y="${ly-1}" text-anchor="middle" font-size="10.5" font-weight="800"
        fill="#fff" font-family="system-ui">${uf}</text>
      <text x="${lx}" y="${ly+9}" text-anchor="middle" font-size="9" font-weight="700"
        fill="#cfd3da" font-family="system-ui">${lbl}</text></g>`
  })
  s+='</svg>'
  return s
}
/* --- gráfico de área/linha --- */
function areaChart(series,opts={}){
  const W=opts.w||700, H=opts.h||210, P={t:16,r:14,b:26,l:44}
  const labels=opts.labels||[]
  const todos=series.flatMap(s=>s.data)
  const mx=Math.max(...todos,1), mn=0
  const iw=W-P.l-P.r, ih=H-P.t-P.b
  const px=i=>P.l+(labels.length>1?i/(labels.length-1)*iw:iw/2)
  const py=v=>P.t+ih-((v-mn)/(mx-mn||1))*ih
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="${svgNS}">`
  s+=`<defs>`
  series.forEach((se,i)=>{s+=`<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${se.cor}" stop-opacity=".38"/>
    <stop offset="100%" stop-color="${se.cor}" stop-opacity="0"/></linearGradient>`})
  s+=`</defs>`
  // grade
  for(let g=0;g<=4;g++){const y=P.t+ih-(g/4)*ih
    s+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <text x="${P.l-8}" y="${y+3.5}" text-anchor="end" font-size="9" fill="#6b7280" font-family="system-ui">
          ${mx*g/4>=1000?((mx*g/4)/1000).toFixed(1)+'k':Math.round(mx*g/4)}</text>`}
  series.forEach((se,i)=>{
    const pts=se.data.map((v,j)=>`${px(j)},${py(v)}`).join(' ')
    if(se.area!==false) s+=`<polygon points="${P.l},${P.t+ih} ${pts} ${px(se.data.length-1)},${P.t+ih}" fill="url(#g${i})"/>`
    s+=`<polyline points="${pts}" fill="none" stroke="${se.cor}" stroke-width="${se.w||2.4}"
      stroke-linejoin="round" stroke-linecap="round" ${se.tracejado?'stroke-dasharray="5 4"':''}/>`
    se.data.forEach((v,j)=>{if(v>0)s+=`<circle cx="${px(j)}" cy="${py(v)}" r="3.2" fill="${se.cor}"
      stroke="#0d0d11" stroke-width="1.5"><title>${labels[j]||''}: ${fmt(v)}</title></circle>`})
  })
  labels.forEach((l,i)=>{s+=`<text x="${px(i)}" y="${H-8}" text-anchor="middle" font-size="9.5"
    font-weight="700" fill="#8a8f99" font-family="system-ui">${l}</text>`})
  s+='</svg>'
  return s
}
/* --- rosca --- */
function donut(itens,opts={}){
  const S=opts.size||168, R=S/2-6, r=R*0.60, cx=S/2, cy=S/2
  const tot=itens.reduce((a,x)=>a+x.v,0)||1
  let ang=-Math.PI/2, s=`<svg viewBox="0 0 ${S} ${S}" style="width:${S}px;height:${S}px" xmlns="${svgNS}">`
  itens.forEach(it=>{
    const frac=it.v/tot, a2=ang+frac*Math.PI*2
    const big=frac>.5?1:0
    const x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang)
    const x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2)
    const x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2)
    const x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang)
    s+=`<path d="M${x1},${y1} A${R},${R} 0 ${big},1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${big},0 ${x4},${y4} Z"
      fill="${it.cor}" opacity=".9"><title>${it.l}: ${fmt(it.v)} (${Math.round(frac*100)}%)</title></path>`
    ang=a2
  })
  if(opts.centro) s+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="21" font-weight="800"
    fill="#f3f4f7" font-family="system-ui">${opts.centro}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="8.5" font-weight="700"
    fill="#8a8f99" letter-spacing="1.4" font-family="system-ui">${opts.rotulo||''}</text>`
  return s+'</svg>'
}
/* --- medidor em arco --- */
function gauge(pct,label,opts={}){
  const W=210,H=126,cx=W/2,cy=H-8,R=88
  const a=Math.PI*(1-Math.min(Math.max(pct,0),1.35)/1.35)
  const pt=(ang,rr)=>[cx+rr*Math.cos(ang),cy-rr*Math.sin(ang)]
  const arc=(a1,a2,rr,cor,w)=>{const [x1,y1]=pt(a1,rr),[x2,y2]=pt(a2,rr)
    const big=Math.abs(a1-a2)>Math.PI?1:0
    return `<path d="M${x1},${y1} A${rr},${rr} 0 ${big},1 ${x2},${y2}" fill="none" stroke="${cor}" stroke-width="${w}" stroke-linecap="round"/>`}
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" xmlns="${svgNS}">`
  s+=arc(Math.PI,0,R,'rgba(255,255,255,.07)',13)
  const cor=pct>=1?'#37c98a':pct>=.7?'#f2b53c':'#ff2b38'
  s+=arc(Math.PI,a,R,cor,13)
  s+=`<text x="${cx}" y="${cy-26}" text-anchor="middle" font-size="30" font-weight="800" fill="${cor}"
    font-family="system-ui" letter-spacing="-1">${Math.round(pct*100)}%</text>
    <text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="9" font-weight="700" fill="#8a8f99"
    letter-spacing="1.6" font-family="system-ui">${label}</text>`
  return s+'</svg>'
}

function barrasH(itens,opts={}){
  const mx=Math.max(...itens.map(x=>x.v),1)
  return itens.map(it=>`<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
    <div class="mini" style="width:${opts.lw||96}px;text-align:right;font-weight:600">${esc(it.l)}</div>

      <div style="height:100%;width:${Math.round(it.v/mx*100)}%;border-radius:5px;
        background:${it.cor||'linear-gradient(90deg,#8a0400,#ff2b38)'}"></div>
      <div style="position:absolute;right:7px;top:0;line-height:19px;font-size:10px;font-weight:800;

/* FONTE ÚNICA: histórico congelado + demandas lançadas no sistema.
   Conforme a equipe usa o sistema, as demandas alimentam o dashboard sozinhas. */
function eventosUnificados(){
  const hist=DB.ehist.map(x=>({ano:+x.ano||0,mes:+x.mes||0,nome:x.nome,metragem:+x.metragem||0,
    tipo_painel:x.tipo_painel,comercial:x.comercial,cidade:x.cidade,uf:x.uf,
    painel_sub:+x.painel_sub||0,fonte:'HISTORICO'}))
  const dem=DB.dem.filter(d=>d.data_saida).map(d=>{
    const dt=String(d.data_saida)
    return {ano:+dt.slice(0,4),mes:+dt.slice(5,7),nome:d.evento,metragem:+d.metragem||0,
      tipo_painel:d.tipo_painel||'ILED',comercial:d.comercial,cidade:d.cidade,
      uf:d.uf||(d.base==='SP'?'SP':'DF'),painel_sub:+d.painel_sub||0,fonte:'SISTEMA'}})
  return hist.concat(dem)
}
function aggMes(evs,ano){
  const a={}; for(let m=1;m<=12;m++)a[m]={eventos:0,m2:0,cidades:new Set(),sub:0}
  evs.filter(x=>x.ano===ano).forEach(x=>{
    const m=x.mes; if(m<1||m>12)return
    a[m].eventos++; a[m].m2+=x.metragem; a[m].sub+=x.painel_sub
    if(x.cidade)a[m].cidades.add(String(x.cidade).trim().toUpperCase())})
  for(let m=1;m<=12;m++)a[m].cidades=a[m].cidades.size
  return a
}
function heatColor(t){
  if(t<.01) return 'rgba(255,255,255,.03)'
  if(t<.5){const k=t/.5
    return `rgba(${Math.round(20+235*k)},${Math.round(20+184*k)},${Math.round(24-24*k)},.78)`}
  const k=(t-.5)/.5
  return `rgba(255,${Math.round(204-173*k)},${Math.round(0+24*k)},.85)`
}

function desenhaHeat(agg){
  const meses=Object.keys(agg).filter(m=>agg[m].eventos>0)
  if(!meses.length){$('#dh_heat').innerHTML='<div class="mini" style="padding:20px">Sem dados no ano.</div>';return}
  const inds=[['eventos','EVENTOS'],['m2','METRAGEM (m²)'],['cidades','CIDADES'],['sub','SUBLOCAÇÃO (m²)']]
  const stress=meses.map(()=>0)
  let html=`<div style="display:grid;grid-template-columns:130px repeat(${meses.length},1fr);gap:3px;min-width:${130+meses.length*62}px">`
  html+='<div></div>'+meses.map(m=>`<div class="eyebrow" style="text-align:center;font-size:9px">${MESN[m]}</div>`).join('')
  for(const [k,lb] of inds){
    const vals=meses.map(m=>agg[m][k])
    const mn=Math.min(...vals), mx=Math.max(...vals)
    html+=`<div class="mini" style="font-weight:700;display:flex;align-items:center">${lb}</div>`
    vals.forEach((v,i)=>{
      const t=mx===mn?0:(v-mn)/(mx-mn); stress[i]+=t
      html+=`<div style="height:34px;border-radius:5px;background:${heatColor(t)};display:grid;place-items:center;
        font-size:10px;font-weight:700;color:${t>.2?'#fff':'#8a8f99'}" title="${lb}: ${fmt(v)}">
        ${v?(k==='m2'||k==='sub'?fmt(Math.round(v)):v):'—'}</div>`
    })
  }
  html+='</div>'
  $('#dh_heat').innerHTML=html
  let top=0,low=0
  stress.forEach((v,i)=>{if(v>stress[top])top=i; if(v<stress[low])low=i})
  $('#dh_top').textContent=MESL[meses[top]]
  $('#dh_low').textContent=MESL[meses[low]]
}

// desenha o pixel map num canvas dado (na resolução real)
function pmDesenha(ctx, W, H, r, cb){
  var p=PM_CFG.padrao
  // fundo base
  if(p==='branco'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H) }
  else if(p==='vermelho'){ ctx.fillStyle='#ff0000'; ctx.fillRect(0,0,W,H) }
  else if(p==='verde'){ ctx.fillStyle='#00ff00'; ctx.fillRect(0,0,W,H) }
  else if(p==='azul'){ ctx.fillStyle='#0000ff'; ctx.fillRect(0,0,W,H) }
  else if(p==='preto'){ ctx.fillStyle='#000000'; ctx.fillRect(0,0,W,H) }
  else if(p==='gradiente'){
    var g=ctx.createLinearGradient(0,0,W,0); g.addColorStop(0,'#000000');g.addColorStop(1,'#ff0000')
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H)
  }
  else if(p==='barras'){
    var cores=['#ffffff','#ffff00','#00ffff','#00ff00','#ff00ff','#ff0000','#0000ff','#000000']
    var bw=W/cores.length
    for(var i=0;i<cores.length;i++){ ctx.fillStyle=cores[i]; ctx.fillRect(Math.round(i*bw),0,Math.ceil(bw),H) }
  }
  else { // grade: fundo escuro
    ctx.fillStyle='#0a1020'; ctx.fillRect(0,0,W,H)
  }
  // grade das placas
  if(PM_CFG.mostrarGrade){
    var cw=W/r.cabsW, ch=H/r.cabsH
    ctx.lineWidth=Math.max(1,Math.round(W/1400))
    ctx.strokeStyle=(p==='grade')?'rgba(80,150,255,.55)':(p==='gradiente'?'rgba(150,150,150,.6)':'rgba(255,255,255,.35)')
    for(var c=0;c<=r.cabsW;c++){ var x=Math.round(c*cw); ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke() }
    for(var rr=0;rr<=r.cabsH;rr++){ var y=Math.round(rr*ch); ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke() }
    // borda externa reforçada
    ctx.strokeStyle=(p==='grade')?'rgba(120,180,255,.9)':(p==='gradiente'?'rgba(170,170,170,.8)':'rgba(255,255,255,.7)')
    ctx.lineWidth=Math.max(2,Math.round(W/700)); ctx.strokeRect(0,0,W,H)
  }
  // logo + identificação (marca d'água central)
  function desenhaTexto(){
    if(PM_CFG.nome){
      var fs=Math.max(14,Math.round(H*0.05))
      ctx.font='800 '+fs+'px system-ui, Arial, sans-serif'
      ctx.textAlign='center'; ctx.textBaseline='middle'
      ctx.fillStyle='rgba(255,214,0,.92)'
      ctx.lineWidth=Math.max(1,Math.round(H*0.004)); ctx.strokeStyle='rgba(0,0,0,.35)'
      ctx.strokeText(PM_CFG.nome, W/2, H/2+ (PM_CFG.mostrarLogo?H*0.16:0))
      ctx.fillText(PM_CFG.nome, W/2, H/2+ (PM_CFG.mostrarLogo?H*0.16:0))
    }
    cb&&cb()
  }
  if(PM_CFG.mostrarLogo && typeof LOGO_BRANCA!=='undefined'){
    var img=new Image()
    img.onload=function(){
      var lw=Math.min(W*0.4, H*0.5), lh=lw*(img.height/img.width)
      ctx.globalAlpha=0.42
      ctx.drawImage(img, W/2-lw/2, H/2-lh/2 - (PM_CFG.nome?H*0.05:0), lw, lh)
      ctx.globalAlpha=1
      desenhaTexto()
    }
    img.onerror=function(){ desenhaTexto() }
    img.src=LOGO_BRANCA
  } else {
    desenhaTexto()
  }
}
function pmDesenhaPreview(r){
  var cv=document.getElementById('pm_preview'); if(!cv) return
  // preview reduzido mantendo proporção, máx 900px de largura
  var maxW=900, sc=Math.min(1, maxW/r.resW)
  var pw=Math.max(1,Math.round(r.resW*sc)), ph=Math.max(1,Math.round(r.resH*sc))
  cv.width=pw; cv.height=ph
  var ctx=cv.getContext('2d')
  pmDesenha(ctx, pw, ph, r, null)
}
__crud.pixelMapBaixar=function(){
  var r=calcScreen(CP.modelo,CP.larg,CP.alt); if(!r) return
  var W=r.resW, H=r.resH

// ---- Test pattern ANIMADO estilo Resolume (grade + círculo + linhas varrendo + logo + resolução) ----
var PM_LOGO_IMG=null
function pmCarregaLogo(cb){
  if(PM_LOGO_IMG){ cb(PM_LOGO_IMG); return }
  if(typeof LOGO_BRANCA==='undefined'){ cb(null); return }
  var img=new Image(); img.onload=function(){PM_LOGO_IMG=img;cb(img)}; img.onerror=function(){cb(null)}; img.src=LOGO_BRANCA
}
// desenha 1 frame do test pattern. t = progresso 0..1 (loop)
function pmFrameResolume(ctx, W, H, r, t, logo){
  // fundo: xadrez cinza (tabuleiro) como o Resolume
  var cell=Math.max(8, Math.round(Math.min(W,H)/24))
  for(var y=0;y<H;y+=cell){
    for(var x=0;x<W;x+=cell){
      var on=(((x/cell)|0)+((y/cell)|0))%2===0
      ctx.fillStyle=on?'#8a8a8a':'#6f6f6f'
      ctx.fillRect(x,y,cell,cell)
    }
  }
  // grade das placas (linhas mais fortes por gabinete)
  var cw=W/r.cabsW, ch=H/r.cabsH
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=Math.max(1,Math.round(W/1600))
  for(var c=0;c<=r.cabsW;c++){var gx=Math.round(c*cw);ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
  for(var rr2=0;rr2<=r.cabsH;rr2++){var gy=Math.round(rr2*ch);ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
  // círculo central + eixos tracejados
  var cx=W/2, cy=H/2, rad=Math.min(W,H)*0.34
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=Math.max(1.5,Math.round(W/1200))
  ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.stroke()
  ctx.setLineDash([Math.round(W/120),Math.round(W/120)])
  ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke()
  ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke()
  ctx.setLineDash([])
  // diagonais fixas de canto a canto (referência)
  ctx.strokeStyle='rgba(255,255,255,.25)'
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,H);ctx.stroke()
  ctx.beginPath();ctx.moveTo(W,0);ctx.lineTo(0,H);ctx.stroke()
  // LINHAS VARRENDO: uma horizontal e uma vertical que cruzam a tela (vai e volta)
  var tt=(t<0.5)?(t*2):(1-(t-0.5)*2) // 0->1->0 (varre e volta)
  var sx=Math.round(tt*W), sy=Math.round(tt*H)
  ctx.strokeStyle='rgba(255,60,60,.95)'; ctx.lineWidth=Math.max(2,Math.round(W/500))
  ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,H);ctx.stroke()  // vertical varrendo
  ctx.strokeStyle='rgba(60,150,255,.95)'
  ctx.beginPath();ctx.moveTo(0,sy);ctx.lineTo(W,sy);ctx.stroke()  // horizontal varrendo
  // diagonal que varre de canto a canto
  var dt=t // 0..1
  ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=Math.max(2,Math.round(W/650))
  var dx=Math.round(dt*W*2 - W) // desloca a diagonal
  ctx.beginPath();ctx.moveTo(dx,0);ctx.lineTo(dx+W,H);ctx.stroke()
  // logo ILED no centro
  if(logo){
    var lw=Math.min(W*0.26,H*0.34), lh=lw*(logo.height/logo.width)
    ctx.globalAlpha=0.95
    ctx.drawImage(logo, cx-lw/2, cy-lh/2-H*0.02, lw, lh)
    ctx.globalAlpha=1
  }
  // resolução + identificação
  ctx.textAlign='center'; ctx.textBaseline='middle'
  var fs=Math.max(14,Math.round(H*0.028))
  ctx.font='700 '+fs+'px system-ui,Arial,sans-serif'
  ctx.fillStyle='rgba(255,255,255,.92)'
  ctx.fillText(W+' | '+H, cx, cy+rad*0.5)
  if(PM_CFG.nome){
    ctx.font='800 '+Math.round(fs*1.1)+'px system-ui,Arial,sans-serif'
    ctx.fillStyle='rgba(255,214,0,.95)'
    ctx.fillText(PM_CFG.nome, cx, cy+rad*0.5+fs*1.6)
  }
}
__crud.pixelMapVideo=function(){
  var r=calcScreen(CP.modelo,CP.larg,CP.alt); if(!r){ toast('Preencha as medidas',false); return }
  var msg=document.getElementById('pm_vidmsg')
  function setMsg(s){ if(msg)msg.textContent=s }
  if(typeof MediaRecorder==='undefined' || !HTMLCanvasElement.prototype.captureStream){
    setMsg('Navegador não suporta gravação de vídeo. Use Chrome/Edge atualizado.')
    toast('Navegador não suporta gravação',false); return
  }
  // limita resolução do vídeo pra caber (vídeo grande trava). Máx lado 1920 mantendo proporção.
  var VW=r.resW, VH=r.resH, MAXV=1920
  if(VW>MAXV||VH>MAXV){ var sc=Math.min(MAXV/VW,MAXV/VH); VW=Math.round(VW*sc); VH=Math.round(VH*sc) }
  // garante par (alguns codecs exigem)
  VW-=VW%2; VH-=VH%2
  var cv=document.createElement('canvas'); cv.width=VW; cv.height=VH
  var ctx=cv.getContext('2d')
  var fps=30, dur=7 // ~7s de loop
  var totalFrames=fps*dur
  pmCarregaLogo(function(logo){
    // escolhe o melhor mime disponível (tenta MP4, cai pra WebM)
    var tipos=['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']
    var mime=''
    for(var i=0;i<tipos.length;i++){ if(MediaRecorder.isTypeSupported(tipos[i])){ mime=tipos[i]; break } }
    if(!mime){ setMsg('Nenhum formato de vídeo suportado.'); toast('Sem codec de vídeo',false); return }
    var ehMp4=mime.indexOf('mp4')>=0
    var stream=cv.captureStream(fps)
    var chunks=[]
    var rec
    try{ rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000}) }
    catch(e){ setMsg('Falha ao iniciar gravação: '+e.message); toast('Erro no MediaRecorder',false); return }
    rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size>0)chunks.push(ev.data) }
    rec.onstop=function(){
      var blob=new Blob(chunks,{type:mime})
      var url=URL.createObjectURL(blob)
      var ext=ehMp4?'mp4':'webm'
      var nomeArq=(PM_CFG.nome||r.m.label).replace(/[^a-zA-Z0-9\-_]+/g,'_').slice(0,40)
      var a=document.createElement('a'); a.href=url; a.download='testpattern_'+nomeArq+'_'+VW+'x'+VH+'.'+ext
      document.body.appendChild(a); a.click(); document.body.removeChild(a)
      setTimeout(function(){URL.revokeObjectURL(url)},3000)
      setMsg('Vídeo '+ext.toUpperCase()+' gerado ('+VW+'×'+VH+')'+(ehMp4?'':' — WebM (seu navegador não gera MP4; converta se precisar).'))
      toast('Vídeo exportado ('+ext.toUpperCase()+')')
    }
    setMsg('Gravando… não feche o modal ('+dur+'s)')
    toast('Gravando vídeo de teste…')
    rec.start()
    var frame=0
    function passo(){
      var t=(frame%totalFrames)/totalFrames
      pmFrameResolume(ctx,VW,VH,r,t,logo)
      frame++
      if(frame<=totalFrames){ requestAnimationFrame(passo) }
      else { setTimeout(function(){ rec.stop() }, 120) }
    }
    requestAnimationFrame(passo)
  })
}

function cpDesfazer(r){
  var s=CP.mapa==='sinal'?CP.sigSel:CP.acSel

  if(melhorK!==null){ delete s.assign[melhorK]; delete s.seq[melhorK] }
  desenhaGrade(r)
}
const CORES=['#e10600','#3d74ff','#37c98a','#f2b53c','#a855f7','#06b6d4','#f97316','#ec4899',

// sincroniza a grade manual com as dimensões atuais da tela (cols e linhas de meia-altura)
function manualSincronizaGrade(r){
  var man=CP.manual; if(!man)return
  // largura em placas = mesma da tela automática (cabsW). altura em MEIAS = cabsH * (altura da placa / 0.5)
  var specMeia=placaSpec(CP.modelo,'p50')
  var larguraM=(+CP.larg||6), alturaM=(+CP.alt||3)
  man.cols=Math.max(1, Math.round(larguraM/specMeia.larg))
  man.rowsMeia=Math.max(1, Math.round(alturaM/0.5))  // cada meia = 0,5m
}
// grade interativa de disposição manual (placas 50x50 e 50x100)
// ---- helpers do modelo de placas manual (independentes, sem __occ) ----
// cada placa: chave 'rmTopo_c' -> {tipo}. 50x100 ocupa rmTopo e rmTopo+1. 50x50 ocupa rmTopo.
function manCelOcupada(rm,c){
  var man=CP.manual
  if(man.placas[rm+'_'+c]) return {dono:rm+'_'+c}
  var kAcima=(rm-1)+'_'+c
  if(man.placas[kAcima] && man.placas[kAcima].tipo==='p100') return {dono:kAcima}
  return null
}
function manColoca(rm,c){
  var man=CP.manual
  var tipo=man.pecaAtiva
  var unid=(tipo==='p100')?2:1
  if(rm+unid>man.rowsMeia) return false
  // limpa qualquer placa que ocupe as células alvo
  for(var u=0;u<unid;u++){
    var occ=manCelOcupada(rm+u,c)
    if(occ) delete man.placas[occ.dono]
  }
  man.placas[rm+'_'+c]={tipo:tipo}
  return true
}
function manRemove(rm,c){
  var man=CP.manual
  var occ=manCelOcupada(rm,c)
  if(occ){ delete man.placas[occ.dono]; return true }
  return false
}
// ---- camada Sinal/AC sobre a disposição manual ----
function manListaPlacas(){
  var man=CP.manual, lst=[]
  for(var k in man.placas){ if(k.indexOf('__occ')>=0)continue
    var pc=k.split('_'); lst.push({key:k, rm:+pc[0], c:+pc[1], tipo:man.placas[k].tipo, unid:man.placas[k].tipo==='p100'?2:1}) }
  lst.sort(function(a,b){ if(a.c!==b.c)return a.c-b.c; return a.rm-b.rm })
  return lst
}

function manAtualizaResumoSel(){

    var gr=grupos[g], cor=manCorGrupo(g)

    if(ehSig && gr.px>lim) alerta=' · <span style="color:#ff6b6b;font-weight:800">EXCEDE 650k</span>'

      '<span style="font-weight:800;color:'+cor+'">'+(ehSig?'Porta ':'Circuito ')+(g+1)+'</span>'+
      '<span class="mini">'+gr.placas+' placa(s) · '+gr.unids+' un.-meia'+(ehSig?(' · '+fmt(gr.px)+' px'+alerta):'')+'</span></div>'
  })
  html+='</div>'
  host.innerHTML=html
}
